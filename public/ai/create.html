            ensureAiAssistant();
            activityData.aiAssistant.floatVisible = true;
            activityData.aiAssistant.miniOpen = false;
            activityData.aiAssistant.fullscreenOpen = true;
            renderAiAssistant();
        }

        function closeAiFullscreen() {
            if (isArchiveAiPlannerEmbed()) {
                showToast("AI 策划助手已在资料库页面打开。如需离开，请使用资料库左侧导航。");
                return;
            }
            activityData.aiAssistant.fullscreenOpen = false;
            renderAiAssistant();
        }

        function isArchiveAiPlannerEmbed() {
            const params = new URLSearchParams(window.location.search);
            return params.get("embed") === "archive-planner";
        }

        function openArchiveAiPlannerEmbed() {
            if (!isArchiveAiPlannerEmbed()) return;
            ensureAiAssistant();
            document.body.classList.add("archive-ai-planner-embed");
            activityData.aiAssistant.floatVisible = false;
            activityData.aiAssistant.miniOpen = false;
            activityData.aiAssistant.fullscreenOpen = true;
            renderAiAssistant();
        }

        function cancelAiThinking() {
            ensureAiAssistant();
            if (activeAiAbortController) {
                activeAiAbortController.abort();
                activeAiAbortController = null;
            }
            const ai = activityData.aiAssistant;
            const session = getCurrentAiSession();
            const messages = getCurrentAiMessages();
            ai.activeRequestId = null;
            const stoppedMessages = messages.map(m => {
                if (!m.loading) return m;
                return {
                    role: "assistant",
                    text: "已停止等待模型返回。你可以重新发送，或先使用当前本地草稿继续编辑。",
                    createdAt: new Date().toISOString()
                };
            });
            if (session) {
                session.messages = stoppedMessages;
                session.updatedAt = new Date().toISOString();
            }
            syncAiSessionToLegacy();
            ai.isThinking = false;
            if (!ai.draftPlan) {
                const idea = getLastUserIdea();
                ai.draftPlan = buildAiDraftPlan(idea);
                ai.feasibilityReport = buildAiFeasibilityReport(idea);
                if (session) {
                    session.draftPlan = ai.draftPlan;
                    session.feasibilityReport = ai.feasibilityReport;
                }
            }
            saveActivityData();
            renderAiAssistant();
        }

        function toggleAiHistory(id) {
            const selected = activityData.aiAssistant.selectedHistoryIds;
            const idx = selected.indexOf(id);
            if (idx >= 0) selected.splice(idx, 1);
            else selected.push(id);
            saveActivityData();
            renderAiAssistant();
        }

        function startAiRequestGuard(requestId, pendingIndex, responseMode, idea) {
            setTimeout(() => {
                ensureAiAssistant();
                const ai = activityData.aiAssistant;
                const session = getCurrentAiSession();
                const messages = getCurrentAiMessages();
                const pending = messages[pendingIndex];
                if (ai.activeRequestId !== requestId || !pending) return;

                if (responseMode === "plan") {
                    ai.draftPlan = ai.draftPlan || buildAiDraftPlan(idea);
                    ai.feasibilityReport = ai.feasibilityReport || buildAiFeasibilityReport(idea);
                    if (session) {
                        session.draftPlan = ai.draftPlan;
                        session.feasibilityReport = ai.feasibilityReport;
                    }
                }
                messages[pendingIndex] = {
                    role: "assistant",
                    text: responseMode === "plan"
                        ? "DeepSeek 响应时间过长，已先结束等待并用本地规则生成一版草稿。请检查右侧预览，或重新发送生成请求。"
                        : "DeepSeek 响应时间过长，已自动结束本次等待。你可以继续对话，或明确说“生成策划案”再生成草稿。",
                    adoption: buildAiAdoptionForMessage(responseMode === "plan"
                        ? "DeepSeek 响应时间过长，已先结束等待并用本地规则生成一版草稿。请检查右侧预览，或重新发送生成请求。"
                        : "DeepSeek 响应时间过长，已自动结束本次等待。你可以继续对话，或明确说“生成策划案”再生成草稿。", pendingIndex),
                    createdAt: new Date().toISOString()
                };
                if (session) session.updatedAt = new Date().toISOString();
                syncAiSessionToLegacy();
                ai.isThinking = false;
                ai.activeRequestId = null;
                saveActivityData();
                renderAiAssistant();
            }, AI_REQUEST_TIMEOUT_MS);
        }

        function finishAiRequest(requestId, pendingIndex, messageText) {
            ensureAiAssistant();
            const ai = activityData.aiAssistant;
            const session = getCurrentAiSession();
            const messages = getCurrentAiMessages();
            if (messages[pendingIndex]) {
                messages[pendingIndex] = {
                    role: "assistant",
                    text: messageText,
                    adoption: buildAiAdoptionForMessage(messageText, pendingIndex),
                    createdAt: new Date().toISOString()
                };
                if (session) {
                    session.updatedAt = new Date().toISOString();
                    updateAiSessionTitle(session);
                }
                syncAiSessionToLegacy();
            }
            if (ai.activeRequestId === requestId) {
                ai.isThinking = false;
                ai.activeRequestId = null;
            }
            saveActivityData();
            try {
                renderAiAssistant();
            } catch (error) {
                console.error("AI assistant render failed:", error);
                messages[pendingIndex] = {
                    role: "assistant",
                    text: `已结束等待，但界面预览渲染时出现问题：${error.message || error}`,
                    createdAt: new Date().toISOString()
                };
                syncAiSessionToLegacy();
                ai.isThinking = false;
                ai.activeRequestId = null;
                saveActivityData();
            }
        }

        function finishAiRequestWithError(requestId, pendingIndex, responseMode, idea, error) {
            ensureAiAssistant();
            const ai = activityData.aiAssistant;
            const session = getCurrentAiSession();
            if (responseMode === "plan") {
                ai.draftPlan = ai.draftPlan || buildAiDraftPlan(idea);
                ai.feasibilityReport = ai.feasibilityReport || buildAiFeasibilityReport(idea);
                if (session) {
                    session.draftPlan = ai.draftPlan;
                    session.feasibilityReport = ai.feasibilityReport;
                }
                syncAiSessionToLegacy();
            }
            finishAiRequest(
                requestId,
                pendingIndex,
                responseMode === "plan"
                    ? `DeepSeek 暂时没有返回结果，已先用本地规则生成一版草稿。原因：${error.message || error}`
                    : `DeepSeek 暂时没有返回结果。你可以继续描述活动想法，或明确说“生成策划案”再生成草稿。原因：${error.message || error}`
            );
        }

        function collectAcceptedAiAdoptionContext() {
            return getCurrentAiMessages().map((message, index) => {
                if (message.adoption && message.adoption.status === "accepted") {
                    const userText = message.adoption.userText || getPreviousUserMessageText(index);
                    const assistantText = message.adoption.assistantText || message.text || "";
                    return { type: "讨论采纳", userText, assistantText };
                }
                if (message.confirmation && message.confirmation.type === "planEdit" && message.confirmation.status === "accepted") {
                    return { type: "修改采纳", userText: message.confirmation.editText || "", assistantText: message.text || "" };
                }
                return null;
            }).filter(Boolean);
        }

        function buildAiIdeaWithAdoptionContext(text) {
            const accepted = collectAcceptedAiAdoptionContext();
            if (!accepted.length) return text;
            const notes = accepted.map((item, index) => {
                const userLine = item.userText ? `用户讨论：${item.userText}` : "";
                const aiLine = item.assistantText ? `AI回应：${item.assistantText}` : "";
                return `${index + 1}. ${item.type}\n${[userLine, aiLine].filter(Boolean).join("\n")}`;
            }).join("\n\n");
            return `${text}\n\n【必须采纳进本次策划案的已确认对话/改动】\n${notes}`;
        }

        function askReservedAdoptionsBeforePlan(text, session) {
            const reservedItems = getReservedAiAdoptionItems();
            if (!reservedItems.length) return false;
            session.messages.push({
                role: "assistant",
                text: "你之前有一些选择了“保留意见”的讨论。生成策划案前，请勾选这次要采纳进策划案的内容。",
                reservedReview: {
                    type: "reservedAdoptionReview",
                    status: "pending",
                    planText: text,
                    createdAt: new Date().toISOString()
                },
                createdAt: new Date().toISOString()
            });
            session.updatedAt = new Date().toISOString();
            syncAiSessionToLegacy();
            saveActivityData();
            renderAiAssistant();
            return true;
        }

        function respondAiDiscussionAdoption(messageIndex, status) {
            ensureAiAssistant();
            const session = getCurrentAiSession();
            const messages = getCurrentAiMessages();
            const message = messages[messageIndex];
            if (!message || !message.adoption || message.adoption.status !== "pending") return;
            if (!["accepted", "rejected", "reserved"].includes(status)) return;
            message.adoption.status = status;
            if (session) session.updatedAt = new Date().toISOString();
            syncAiSessionToLegacy();
            saveActivityData();
            renderAiAssistant();
        }

        async function useAiMessageForPlan(messageIndex) {
            ensureAiAssistant();
            if (isAiThinking()) return;
            const session = getCurrentAiSession();
            const messages = getCurrentAiMessages();
            const message = messages[messageIndex];
            if (!session || !message || !message.adoption || message.adoption.type !== "discussionAdoption") return;
            message.adoption.status = "accepted";
            session.updatedAt = new Date().toISOString();
            syncAiSessionToLegacy();
            saveActivityData();
            if (askReservedAdoptionsBeforePlan("生成策划案", session)) {
                renderAiAssistant();
                return;
            }
            await startAiResponseForText("生成策划案", "plan", session);
        }

        function toggleReservedAdoptionReview(messageIndex, checked) {
            document.querySelectorAll(`.ai-reserved-adoption-checkbox[data-review-index="${messageIndex}"]`).forEach(input => {
                input.checked = !!checked;
            });
        }

        async function confirmReservedAdoptionReview(messageIndex) {
            ensureAiAssistant();
            if (isAiThinking()) return;
            const session = getCurrentAiSession();
            const messages = getCurrentAiMessages();
            const reviewMessage = messages[messageIndex];
            if (!reviewMessage || !reviewMessage.reservedReview || reviewMessage.reservedReview.status !== "pending") return;

            const selected = new Set(Array.from(document.querySelectorAll(`.ai-reserved-adoption-checkbox[data-review-index="${messageIndex}"]:checked`))
                .map(input => Number(input.value)));
            getReservedAiAdoptionItems().forEach(item => {
                const target = messages[item.index];
                const status = selected.has(item.index) ? "accepted" : "rejected";
                if (target?.adoption?.status === "reserved") target.adoption.status = status;
                if (target?.confirmation?.status === "reserved") target.confirmation.status = status;
            });
            reviewMessage.reservedReview.status = "accepted";
            reviewMessage.text = selected.size
                ? `已选择采纳 ${selected.size} 条保留意见，正在生成策划案。`
                : "未采纳保留意见，正在按当前对话生成策划案。";
            session.updatedAt = new Date().toISOString();
            syncAiSessionToLegacy();
            saveActivityData();
            renderAiAssistant();
            await startAiResponseForText(reviewMessage.reservedReview.planText || "生成策划案", "plan", session);
        }

        function clearAiHistorySelection() {
            ensureAiAssistant();
            activityData.aiAssistant.selectedHistoryIds = [];
            saveActivityData();
            renderAiAssistant();
        }

        function getSelectedHistoryActivities() {
            const selectedIds = (activityData.aiAssistant && activityData.aiAssistant.selectedHistoryIds) || [];
            return aiHistoryActivities.filter(h => selectedIds.includes(h.id));
        }

        async function startAiResponseForText(text, responseMode, session) {
            const ai = activityData.aiAssistant;
            const workingIdea = responseMode === "plan" ? buildAiIdeaWithAdoptionContext(text) : text;
            if (activeAiAbortController) {
                activeAiAbortController.abort();
                activeAiAbortController = null;
            }
            const requestId = `${Date.now()}-${Math.random().toString(16).slice(2)}`;
            ai.activeRequestId = requestId;

            const pendingMessage = {
                role: "assistant",
                text: responseMode === "plan"
                    ? "已先生成一版本地草稿并显示在右侧，DeepSeek 正在后台增强策划案。你可以继续输入，也可以点“停止生成”取消后台增强。"
                    : "正在基于你的想法生成 3 个可选活动创意方向",
                loading: responseMode !== "plan",
                createdAt: new Date().toISOString()
            };
            session.messages.push(pendingMessage);
            const pendingIndex = session.messages.length - 1;
            syncAiSessionToLegacy();

            if (responseMode === "plan") {
                commitAiPlanToCurrentSession(buildAiDraftPlan(workingIdea), buildAiFeasibilityReport(workingIdea));
                activityData.aiAssistant.isThinking = false;
            } else {
                activityData.aiAssistant.isThinking = true;
            }
            saveActivityData();
            renderAiAssistant();

            if (responseMode === "chat") {
                finishAiRequest(requestId, pendingIndex, buildAiConceptOptionsReply(text));
                return;
            }

            startAiRequestGuard(requestId, pendingIndex, responseMode, workingIdea);

            try {
                const result = await requestDeepSeekPlan(workingIdea, responseMode);
                const liveAi = activityData.aiAssistant;
                const liveSession = getCurrentAiSession();
                if (liveAi.activeRequestId !== requestId || liveAi.currentSessionId !== session.id || !liveSession || !liveSession.messages[pendingIndex]) return;
                try {
                    const returnedDraft = result.draftPlan || result.draft;
                    const returnedReport = result.feasibilityReport || result.report;
                    if (responseMode === "plan" && returnedDraft) {
                        const normalizedDraft = normalizeAiDraftPlan(returnedDraft, workingIdea);
                        const normalizedReport = responseMode === "plan" && returnedReport
                            ? normalizeAiFeasibilityReport(returnedReport, workingIdea)
                            : liveAi.feasibilityReport;
                        commitAiPlanToCurrentSession(normalizedDraft, normalizedReport);
                    }
                    if (responseMode === "plan" && returnedReport && !returnedDraft) {
                        commitAiPlanToCurrentSession(liveAi.draftPlan || buildAiDraftPlan(workingIdea), normalizeAiFeasibilityReport(returnedReport, workingIdea));
                    }
                } catch (normalizeError) {
                    console.error("AI result normalize failed:", normalizeError);
                    if (responseMode === "plan") {
                        commitAiPlanToCurrentSession(buildAiDraftPlan(workingIdea), buildAiFeasibilityReport(workingIdea));
                    }
                }
                syncAiSessionToLegacy();
                finishAiRequest(
                    requestId,
                    pendingIndex,
                    responseMode === "plan"
                        ? (result.reply || "DeepSeek 已生成或修改拟策划案和可行性评估。你可以先检查右侧预览，再选择填入空白项或采纳到策划案。")
                        : normalizeAiChatReply(result.reply, text)
                );
            } catch (error) {
                const liveAi = activityData.aiAssistant;
                const liveSession = getCurrentAiSession();
                if (liveAi.activeRequestId !== requestId || liveAi.currentSessionId !== session.id || !liveSession || !liveSession.messages[pendingIndex]) return;
                if (responseMode === "chat") {
                    finishAiRequest(requestId, pendingIndex, `${buildAiConceptOptionsReply(text)}\n\n（DeepSeek 暂时没有返回，已先用本地规则生成 3 个可选方向。原因：${error.message || error}）`);
                    return;
                }
                finishAiRequestWithError(requestId, pendingIndex, responseMode, workingIdea, error);
            }
        }

        async function sendAiMessage(source) {
            ensureAiAssistant();
            if (isAiThinking()) return;
            const input = document.getElementById(source === "full" ? "aiFullInput" : "aiMiniInput");
            if (!input) {
                console.error("AI input not found:", source);
                return;
            }
            const text = input.value.trim();
            if (!text) return;
            input.value = "";

            const ai = activityData.aiAssistant;
            const session = getCurrentAiSession();
            if (!session) {
                console.error("AI session not found");
                return;
            }
            ai.ideaInput = text;
            const userMessage = { role: "user", text, createdAt: new Date().toISOString() };
            session.messages.push(userMessage);
            session.updatedAt = new Date().toISOString();
            updateAiSessionTitle(session);
            syncAiSessionToLegacy();
            const responseMode = getAiResponseMode(text);

            if (responseMode === "confirmEdit") {
                ai.isThinking = false;
                session.messages.push({
                    role: "assistant",
                    text: `我识别到这条内容可能是在修改当前策划案：${text}\n是否执行这条修改？`,
                    confirmation: {
                        type: "planEdit",
                        status: "pending",
                        editText: text
                    },
                    createdAt: new Date().toISOString()
                });
                syncAiSessionToLegacy();
                saveActivityData();
                renderAiAssistant();
                return;
            }

            if (responseMode === "plan" && askReservedAdoptionsBeforePlan(text, session)) return;
            await startAiResponseForText(text, responseMode, session);
        }

        function getAiResponseMode(text) {
            const clean = String(text || "").trim();
            const hasDraft = !!activityData.aiAssistant.draftPlan;
            const explicitPlanIntent = /(生成|输出|写|起草|拟定|形成|整理成|完善成).{0,10}(策划案|活动方案|完整方案|拟策划案|草稿)|^(生成策划案|输出策划案|写策划案|起草策划案|拟定策划案)|采纳到策划案|填入/.test(clean);
            const negativePlanIntent = /(不要|不用|无需|先不|暂不|别|不必).{0,10}(生成|输出|写|起草|拟定|形成|策划案|方案|草稿)|先.{0,8}(讨论|聊聊|脑暴|分析|评估).{0,16}(不要|不用|先不|暂不).{0,10}(生成|输出|写|策划案|方案)/.test(clean);
            const planIntent = !negativePlanIntent && explicitPlanIntent;
            const editIntent = /修改|改成|调整|优化|更新|加入|增加|删掉|删除|替换|改一下|换成/.test(clean);
            if (hasDraft && editIntent) return "confirmEdit";
            if (planIntent) return "plan";
            return "chat";
        }

        async function respondAiPlanEditConfirmation(messageIndex, action) {
            ensureAiAssistant();
            if (isAiThinking()) return;
            const ai = activityData.aiAssistant;
            const session = getCurrentAiSession();
            const messages = getCurrentAiMessages();
            const confirmationMessage = messages[messageIndex];
            if (!confirmationMessage || !confirmationMessage.confirmation || confirmationMessage.confirmation.status !== "pending") return;
            const normalizedAction = action === true ? "accepted" : action === false ? "rejected" : action;

            if (normalizedAction === "reserved") {
                confirmationMessage.confirmation.status = "reserved";
                if (session) session.updatedAt = new Date().toISOString();
                syncAiSessionToLegacy();
                saveActivityData();
                renderAiAssistant();
                return;
            }

            if (normalizedAction !== "accepted") {
                confirmationMessage.confirmation.status = "rejected";
                if (session) session.updatedAt = new Date().toISOString();
                syncAiSessionToLegacy();
                saveActivityData();
                renderAiAssistant();
                return;
            }

            const editText = confirmationMessage.confirmation.editText || "";
            confirmationMessage.confirmation.status = "accepted";
            ai.isThinking = true;
            const requestId = `${Date.now()}-${Math.random().toString(16).slice(2)}`;
            ai.activeRequestId = requestId;
            const pendingIndex = messages.push({
                role: "assistant",
                text: "已确认执行，正在等待 DeepSeek 按这条意见修改策划案",
                loading: true,
                createdAt: new Date().toISOString()
            }) - 1;
            if (session) session.updatedAt = new Date().toISOString();
            syncAiSessionToLegacy();
            saveActivityData();
            renderAiAssistant();
            startAiRequestGuard(requestId, pendingIndex, "plan", editText);

            try {
                const result = await requestDeepSeekPlan(editText, "plan");
                if (ai.activeRequestId !== requestId || ai.currentSessionId !== session.id || !messages[pendingIndex]?.loading) return;
                try {
                    const returnedDraft = result.draftPlan || result.draft;
                    const returnedReport = result.feasibilityReport || result.report;
                    if (returnedDraft) {
                        ai.draftPlan = normalizeAiDraftPlan(returnedDraft, editText);
                        session.draftPlan = ai.draftPlan;
                    }
                    if (returnedReport) {
                        ai.feasibilityReport = normalizeAiFeasibilityReport(returnedReport, editText);
                        session.feasibilityReport = ai.feasibilityReport;
                    }
                } catch (normalizeError) {
                    console.error("AI edit normalize failed:", normalizeError);
                    ai.draftPlan = ai.draftPlan || buildAiDraftPlan(editText);
                    ai.feasibilityReport = ai.feasibilityReport || buildAiFeasibilityReport(editText);
                    session.draftPlan = ai.draftPlan;
                    session.feasibilityReport = ai.feasibilityReport;
                }
                syncAiSessionToLegacy();
                finishAiRequest(
                    requestId,
                    pendingIndex,
                    result.reply || "已按确认意见修改拟策划案。你可以查看右侧预览，并决定是否采纳到策划案。"
                );
            } catch (error) {
                if (ai.activeRequestId !== requestId || ai.currentSessionId !== session.id || !messages[pendingIndex]?.loading) return;
                finishAiRequestWithError(requestId, pendingIndex, "plan", editText, error);
            }
        }

        async function requestDeepSeekPlan(idea, responseMode = "plan") {
            const selectedHistory = buildSelectedHistoryContext();
            const controller = new AbortController();
            activeAiAbortController = controller;
            const timeout = setTimeout(() => controller.abort(), 25000);
            const apiUrl = getDeepSeekApiUrl();
            const response = await fetch(apiUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                signal: controller.signal,
                body: JSON.stringify({
                    idea,
                    activityName: activityData.name,
                    currentPlan: activityData.planSections,
                    currentDraftPlan: activityData.aiAssistant.draftPlan,
                    selectedHistory,
                    messages: getCurrentAiMessages().slice(-16),
                    scoringRubric: getAiScoringRubric(),
                    responseMode
                })
            }).catch(error => {
                if (error.name === "AbortError") {
                    throw new Error(`本地代理请求超时。请求地址：${apiUrl}。请查看 PowerShell 是否打印了 DeepSeek 请求日志。`);
                }
                throw new Error(`无法连接本地代理。当前页面：${window.location.href}；请求地址：${apiUrl}；原始错误：${error.message}`);
            }).finally(() => {
                clearTimeout(timeout);
                if (activeAiAbortController === controller) {
                    activeAiAbortController = null;
                }
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) {
                throw new Error(payload.error || `本地代理返回 HTTP ${response.status}`);
            }
            return payload;
        }

        function getDeepSeekApiUrl() {
            if (window.location.protocol === "http:" || window.location.protocol === "https:") {
                return `${window.location.origin}/api/deepseek/plan`;
            }
            return "http://localhost:3000/api/deepseek/plan";
        }

        function normalizeAiDraftPlan(draft, idea) {
            const fallback = buildAiDraftPlan(idea);
            const generatedName = isCopiedUserPrompt(draft.name, idea) ? fallback.name : draft.name;
            const generatedTheme = isCopiedUserPrompt(draft.theme, idea) ? fallback.theme : draft.theme;
            const contentFlow = stringifyAiField(draft.contentFlow || "");
            const requirements = stringifyAiField(draft.requirements || "");
            const execution = stringifyAiField(draft.execution || "");
            return {
                ...fallback,
                ...draft,
                name: generatedName || fallback.name,
                theme: generatedTheme || fallback.theme,
                targetAudience: draft.targetAudience || draft.audience || fallback.targetAudience,
                countPerSession: String(draft.countPerSession || fallback.countPerSession),
                sessions: String(draft.sessions || fallback.sessions),
                objective: stringifyAiField(draft.objective || fallback.objective),
                purpose: stringifyAiField(draft.purpose || fallback.purpose),
                contentFlow: isGenericAiPlanContent(contentFlow) ? fallback.contentFlow : contentFlow,
                requirements: isGenericAiPlanContent(requirements) ? fallback.requirements : requirements,
                execution: isGenericAiPlanContent(execution) ? fallback.execution : execution,
                riskPlan: stringifyAiField(draft.riskPlan || fallback.riskPlan)
            };
        }

        function isGenericAiPlanContent(value) {
            const text = String(value || "").trim();
            if (!text) return true;
            const genericHits = [
                /签到.{0,12}(开场|破冰).{0,20}(核心|互动).{0,20}(总结|反馈)/s,
                /活动具体内容包括|整体流程如何安排|各环节时长/,
                /根据实际情况调整|相关物资|相关人员|相关流程|负责人负责/,
                /进行互动|开展体验|完成任务|组织交流|总结分享/,
                /xxx|待定|TBD|根据需求/
            ].filter(pattern => pattern.test(text)).length;
            const concreteSignals = [
                /任务卡|挑战卡|剧本|分区|摊位|集章|投票|作品|样例|道具|路线|动线|录制|展示|评分/,
                /\d+\s*(分钟|min|人|组|轮|次)/,
                /参与者.*(扮演|选择|制作|完成|录制|投票|挑战|交换|创作|带走)/,
                /产出|成果|作品|转化|入群|报名|复盘指标/
            ].filter(pattern => pattern.test(text)).length;
            return genericHits >= 2 || concreteSignals === 0 || text.length < 80;
        }

        function stringifyAiField(value) {
            if (value == null) return "";
            if (Array.isArray(value)) {
                return value.map((item, index) => {
                    if (item && typeof item === "object") {
                        const detail = Object.entries(item)
                            .map(([key, val]) => `${key}：${Array.isArray(val) ? val.join("、") : val}`)
                            .join("；");
                        return `${index + 1}. ${detail}`;
                    }
                    return `${index + 1}. ${item}`;
                }).join("\n");
            }
            if (typeof value === "object") {
                return Object.entries(value)
                    .map(([key, val]) => `${key}：${Array.isArray(val) ? val.join("、") : val}`)
                    .join("\n");
            }
            return String(value);
        }

        function isCopiedUserPrompt(value, idea) {
            if (!value) return false;
            const cleanValue = String(value).replace(/\s+/g, "");
            const cleanIdea = String(idea || "").replace(/\s+/g, "");
            return cleanValue.length > 16 && cleanIdea.includes(cleanValue);
        }

        function normalizeAiFeasibilityReport(report, idea) {
            const fallback = buildAiFeasibilityReport(idea);
            return {
                score: report.score || fallback.score,
                level: report.level || fallback.level,
                conclusion: report.conclusion || fallback.conclusion,
                activityProfile: report.activityProfile || report.profile || fallback.activityProfile,
                criteria: Array.isArray(report.criteria) && report.criteria.length ? report.criteria : fallback.criteria,
                risks: Array.isArray(report.risks) && report.risks.length ? report.risks : fallback.risks,
                suggestions: Array.isArray(report.suggestions) && report.suggestions.length ? report.suggestions : fallback.suggestions,
                triggeredRules: Array.isArray(report.triggeredRules) ? report.triggeredRules : fallback.triggeredRules
            };
        }


        function buildAiDraftPlan(idea) {
            const analysis = analyzeActivityIdea(idea);
            const selected = getSelectedHistoryActivities();
            const historyLine = selected.length
                ? buildHistoryReferenceLine(selected)
                : "暂无指定历史活动参考，先按通用社团活动经验生成。";
            const currentName = activityData.name.trim();
            const name = currentName || analysis.name;
            const theme = analysis.theme;
            const safeTime = analysis.recommendedTime || "周末下午或傍晚";
            const coreValue = analysis.valueStatement;
            const po = (activityData.planSections && activityData.planSections.planOverview) || {};
            const execPlanText = buildExecutionPlan(analysis, safeTime);
            const riskPlanText = buildRiskPlan(analysis);
            const dateYear = po.dateYear || "";
            const dateMonth = po.dateMonth || "";
            const dateDay = po.dateDay || "";
            const dateTime = (activityData.planSections && activityData.planSections.dateTime)
                || [dateYear, dateMonth, dateDay].filter(Boolean).join("-");
            return {
                name,
                theme,
                objective: analysis.objective,
                dateYear,
                dateMonth,
                dateDay,
                dateTime,
                location: (activityData.planSections && activityData.planSections.location) || "",
                targetAudience: analysis.targetAudience,
                countPerSession: po.countPerSession || analysis.defaultCount,
                sessions: po.sessions || "1",
                targetCount: (activityData.planSections && activityData.planSections.targetCount) || analysis.defaultCount,
                purpose: `${coreValue}\n${historyLine}\n本活动的意义在于把社团成员的兴趣、表达和协作转化为一次可参与、可复盘、可延展的活动体验，而不是简单复述用户提出的原始问题。`,
                contentFlow: buildContentFlow(analysis),
                requirements: buildRequirements(analysis, safeTime),
                execution: execPlanText,
                riskPlan: riskPlanText,
                executionPlan: parseExecPlanTable(execPlanText),
                emergencyPlan: parseRiskPlanText(riskPlanText)
            };
        }

        function buildSelectedHistoryContext() {
            return getSelectedHistoryActivities().map(h => ({
                id: h.id,
                title: h.title,
                tags: h.tags || [],
                summary: normalizeHistoryContent(h.summary),
                plan: normalizeHistoryContent(h.plan),
                budget: normalizeHistoryContent(h.budget),
                photos: summarizeHistoryPhotos(h.photos),
                reflection: normalizeHistoryContent(h.reflection),
                archive: normalizeHistoryContent(h.archive)
            }));
        }

        function getAiScoringRubric() {
            return {
                version: "club-planner-rubric-v1",
                scale: "100 分制；每项 score 不得超过 max。",
                dimensions: [
                    {
                        name: "可落地性",
                        max: 25,
                        subcriteria: ["规模大小", "是否违反校园规定", "是否有足够的场地支持", "资金需求是否能够满足"],
                        description: "判断活动是否能够在现实条件下顺利执行。规模过大、合规不明、场地或资金缺口明显时应扣分。"
                    },
                    {
                        name: "活动创新性",
                        max: 25,
                        subcriteria: ["形式创新", "内容创新"],
                        description: "判断活动是否只是常规套壳，还是在活动形式、主题内容或参与方式上有新的设计。"
                    },
                    {
                        name: "参与者角度",
                        max: 25,
                        subcriteria: ["参与感如何", "能够收获怎样的技能或实物", "情绪体验怎么样", "能否建立对社团的良好印象甚至归属感"],
                        description: "从参与者收益出发判断活动是否值得参加，包括参与感、获得感、情绪体验和社团认同。"
                    },
                    {
                        name: "困难程度",
                        max: 25,
                        subcriteria: ["活动机制会不会太复杂", "前期准备工作量大不大", "现场控制难度如何", "活动后的收场难度如何"],
                        description: "判断执行难度是否可控。机制复杂、准备量大、现场控制困难或收场压力高时应扣分。"
                    }
                ],
                criticalRules: [
                    { rule: "活动时间 + 活动内容存在明显冲突", effect: "需求匹配度和参与体验必须重扣；如规模较大，结论应倾向不建议按原方案执行。" },
                    { rule: "参与对象 + 活动内容存在合规或伦理冲突", effect: "安全与合规必须重扣，必要时不建议按原方案执行。" },
                    { rule: "大规模 + 场地/人员/预算缺失", effect: "资源可控性和安全与合规重扣。" },
                    { rule: "高强度运动 + 高温/夜间/医疗保障缺失", effect: "安全与合规重扣。" },
                    { rule: "特殊材料/食品/器材 + 成分/资质/使用说明缺失", effect: "安全与合规、资源可控性扣分。" }
                ],
                levelPolicy: [
                    "85-100：较低，推荐执行",
                    "72-84：中等，可优化后执行",
                    "58-71：中等偏高，需要重大调整",
                    "0-57：较高或不建议按原方案执行"
                ]
            };
        }

        function buildHistoryReferenceLine(selected) {
            return selected.map(h => {
                const parts = [];
                if (hasHistoryContent(h.plan)) parts.push("策划案");
                if (hasHistoryContent(h.budget)) parts.push("预算案");
                if (hasHistoryContent(h.photos)) parts.push("现场照片/布置信息");
                if (hasHistoryContent(h.reflection)) parts.push("复盘经验");
                if (hasHistoryContent(h.archive)) parts.push("归档资料");
                return `参考“${h.title}”的${parts.length ? parts.join("、") : "活动摘要"}：${summarizeText(normalizeHistoryContent(h.reflection || h.summary || h.plan), 90)}`;
            }).join("\n");
        }

        function normalizeHistoryContent(value) {
            if (!value) return "";
            if (Array.isArray(value)) {
                return value.map(item => normalizeHistoryContent(item)).filter(Boolean).join("\n");
            }
            if (typeof value === "object") {
                return Object.entries(value)
                    .map(([key, val]) => `${key}：${normalizeHistoryContent(val)}`)
                    .filter(line => !/：$/.test(line))
                    .join("\n");
            }
            return String(value).trim();
        }

        function summarizeHistoryPhotos(photos) {
            if (!photos) return "";
            const list = Array.isArray(photos) ? photos : [photos];
            return list.map((photo, index) => {
                if (!photo) return "";
                if (typeof photo === "string") {
                    if (/^data:image\//.test(photo)) return `现场照片 ${index + 1}：本地上传图片，前端可预览；如需模型理解画面，需要后端提取图片描述或使用多模态模型。`;
                    return `现场照片 ${index + 1}：${photo}`;
                }
                return `现场照片 ${index + 1}：${normalizeHistoryContent(photo)}`;
            }).filter(Boolean).join("\n");
        }

        function buildAiFeasibilityReport(idea) {
            const analysis = analyzeActivityIdea(idea);
            const criteria = scoreFeasibility(analysis);
            const total = criteria.reduce((sum, item) => sum + item.score, 0);
            const level = total >= 85 ? "较低" : total >= 72 ? "中等" : total >= 58 ? "中等偏高" : "较高";
            const triggeredRules = buildTriggeredRules(analysis);
            return {
                score: `${total}/100`,
                level: triggeredRules.some(r => r.severity === "critical") && total < 58 ? "不建议按原方案执行" : level,
                conclusion: buildFeasibilityConclusion(total, analysis, triggeredRules),
                activityProfile: buildLocalActivityProfile(analysis),
                criteria,
                risks: analysis.risks,
                suggestions: analysis.suggestions,
                triggeredRules
            };
        }

        function analyzeActivityIdea(idea) {
            const text = (idea || "").trim();
            const isStory = /故事|交换|分享|叙事/.test(text);
            const isLateNight = /晚上|夜晚|深夜|夜间|通宵|凌晨|晚间/.test(text);
            const isFoodDrink = /饮品|食品|餐饮|甜品|茶|烘焙|试吃|品鉴|料理|美食/.test(text);
            const hasSensitiveContent = /特殊材料|受限物品|高风险|危险|明火|未成年人|校外|夜间外出|资质|审批/.test(text);
            const isCompetition = /比赛|竞赛|马拉松|挑战/.test(text);
            const isExhibitionBooth = /百团|社展|摊位|展台|招新|游园|市集/.test(text);
            const compositeTopics = extractCompositeTopics(text);
            const explicitCount = extractExpectedCount(text);
            const isLarge = /大型|全校|上百|千人|音乐节|晚会/.test(text) || explicitCount >= 80;
            const isCampus = /学校|校园|社团|同学|学生/.test(text);
            const rawTheme = extractThemeFromIdea(text);
            const naming = createActivityNaming(text, { isStory, isLateNight, isFoodDrink, hasSensitiveContent, isCompetition, isLarge, isCampus, isExhibitionBooth, compositeTopics, rawTheme });
            const name = naming.name;
            const theme = naming.theme;
            const risks = [];
            const suggestions = [];

            if (isLateNight && isFoodDrink) {
                risks.push("夜间食品饮品类活动可能涉及返程安全、场地开放时间、噪音管理、清洁收尾和身体负担，需要结合具体内容重新评估。");
                suggestions.push("建议让模型结合社团历史活动和目标人群判断是否保留夜间时段，必要时调整到下午或傍晚早段。");
            }
            if (hasSensitiveContent) {
                risks.push("活动包含可能需要审批、资质、监护或额外安全说明的敏感要素，不能按普通活动直接处理。");
                suggestions.push("建议先确认校内规定、负责人资质、参与对象边界和应急预案，再决定是否继续推进。");
            }
            if (isLarge) {
                risks.push("活动规模较大，对场地容量、安保、志愿者和应急预案要求明显提高。");
                suggestions.push("先做 30-50 人试点版，再根据反馈扩大规模。");
            }
            if (!/时间|地点|人数|对象|预算|场地/.test(text)) {
                risks.push("原始需求缺少时间、地点、人数或对象信息，落地前需要补齐基础条件。");
                suggestions.push("先确认预计人数、目标对象、场地类型和活动时长。");
            }

            if (!risks.length) {
                risks.push("需要进一步确认场地、人数和组织分工，避免方案停留在创意层面。");
            }
            if (!suggestions.length) {
                suggestions.push("建议先做一个低成本试点版本，用签到、反馈表和复盘文档沉淀经验。");
            }
            suggestions.push("预算部分本阶段只提示风险，等预算案模块成型后再拆分金额。");

            const recommendedTime = isLateNight && isFoodDrink ? "周五下午 15:00-17:00 或周末下午 14:00-16:00" : "周末下午或傍晚早段";
            const targetAudience = isCampus ? "本校社团成员及对主题感兴趣的同学" : inferAudience(text);
            const defaultCount = isLarge ? "50" : isCompetition ? "40" : "30";
            const blueprint = buildActivityBlueprint(text, { isStory, isFoodDrink, isCompetition, isExhibitionBooth, compositeTopics, theme });
            const topicText = compositeTopics.length ? compositeTopics.join("、") : trimActivitySuffix(rawTheme || theme);
            const objective = isStory
                ? "通过故事分享和轻量互动增强成员连接，营造安全、开放、有记忆点的社团交流场景。"
                : isExhibitionBooth
                    ? `让路过同学在短时间内看懂${topicText}的社团价值，完成至少一次低门槛体验，并留下后续咨询或报名入口。`
                    : compositeTopics.length
                        ? `通过${topicText}的分组轮转体验，帮助参与者比较不同方向、产出可展示的小成果，并形成后续参与意愿。`
                        : `围绕“${theme}”设计一次可参与、可反馈、可复盘的社团活动。`;
            const valueStatement = isStory
                ? "活动以故事交换为核心，价值不在于单纯完成流程，而在于让参与者通过主题叙事建立连接、表达个人经验，并增强社团内部认同感。"
                : isExhibitionBooth
                    ? `本活动的价值在于把${topicText}从静态介绍变成可停留、可尝试、可转化的摊位体验，提升招新或社团展示的有效触达。`
                    : compositeTopics.length
                        ? `本活动的价值在于把${topicText}从并列介绍变成可轮转体验，让参与者通过具体任务判断兴趣方向，并为社团后续分层运营沉淀线索。`
                        : `活动围绕“${theme}”展开，价值在于将成员兴趣转化为具体参与体验，并为社团后续活动沉淀组织方法。`;

            return {
                text,
                name,
                theme,
                rawTheme,
                isStory,
                isLateNight,
                isFoodDrink,
                isExhibitionBooth,
                compositeTopics,
                hasSensitiveContent,
                isCompetition,
                isLarge,
                explicitCount,
                isCampus,
                recommendedTime,
                targetAudience,
                defaultCount,
                blueprint,
                objective,
                valueStatement,
                risks,
                suggestions
            };
        }

        function buildContentFlow(analysis) {
            if (analysis.isExhibitionBooth) {
                return buildExhibitionFlow(analysis);
            }
            if (analysis.compositeTopics && analysis.compositeTopics.length) {
                return buildCompositeActivityFlow(analysis);
            }
            if (analysis.isStory && analysis.isFoodDrink) {
                return "1. 签到与分组：按 4-6 人小组安排座位，发放故事提示卡。\n2. 破冰引导：主持人说明“故事交换”规则，强调尊重、保密和自愿分享。\n3. 主题体验：围绕活动内容设置轻量体验环节，避免把活动变成单纯消费。\n4. 故事交换：围绕“第一次尝试”“一次转折”“最近的小确幸”等主题轮流分享。\n5. 共创环节：每组提炼一个共同关键词，制作便签墙或故事地图。\n6. 收尾反馈：填写反馈表，邀请参与者写下下一次想听/想讲的主题。";
            }
            return buildSingleThemeFlow(analysis);
        }

        function buildRequirements(analysis, safeTime) {
            const blueprint = analysis.blueprint || buildActivityBlueprint(analysis.text, analysis);
            const base = [
                `建议时间：${safeTime}。`,
                `核心玩法物料：${blueprint.materials.join("、")}。`,
                `场地布置：${blueprint.spaceSetup}`,
                "需提前准备签到表、主持稿、流程表、反馈表和宣传文案。"
            ];
            if (analysis.isExhibitionBooth) base.push("社展摊位需提前确认展位尺寸、用电限制、陈列物料、人员轮班表、高峰期排队方式和 30 秒介绍话术。");
            if (analysis.compositeTopics && analysis.compositeTopics.length) base.push(`分区物料需对应${analysis.compositeTopics.join("、")}，每个方向至少准备一个可观察、可尝试、可拍照传播的互动任务。`);
            if (analysis.isFoodDrink) base.push("食品饮品类内容需明确成分、过敏提示、保存方式和现场清洁责任。");
            if (analysis.hasSensitiveContent) base.push("涉及敏感要素时，需提前确认审批要求、负责人资质、参与对象边界和应急预案。");
            base.push("预算部分本阶段只提示风险，后续重点核算场地/展位、核心物料、宣传品、互动奖励、备用耗材和应急费用。");
            return base.join("\n");
        }

        function buildExecutionPlan(analysis, safeTime) {
            const blueprint = analysis.blueprint || buildActivityBlueprint(analysis.text, analysis);
            const topicWork = analysis.compositeTopics && analysis.compositeTopics.length
                ? `拆分${analysis.compositeTopics.join("、")}各分区负责人，分别产出互动任务、话术和物料清单`
                : `制作“${blueprint.coreMechanic}”所需的任务卡、样例素材、现场规则和物料清单`;
            return `| 时间节点 | 任务 | 负责人 | 交付物 |\n|---------|------|--------|--------|\n| T-10 天 | 明确主题、对象、人数上限和活动时间（建议 ${safeTime}） | 策划负责人 | 活动初稿 |\n| T-8 天 | ${topicWork} | 各板块负责人 | 分区任务卡/物料表 |\n| T-6 天 | 设计参与者动线、报名/留资方式、集章或奖励机制 | 执行负责人 | 动线图/转化表单 |\n| T-5 天 | 发布宣传与报名通道，说明活动亮点和参与方式 | 宣传负责人 | 推文/海报/报名表 |\n| T-2 天 | 全流程彩排：30 秒介绍、分区体验、拥堵处理、收尾清点 | 全体执行组 | 彩排记录/问题清单 |\n| 活动当天 | 控制节奏、维护秩序、记录咨询和报名数据 | 全体执行组 | 签到表/咨询记录/反馈表 |\n| T+3 天 | 复盘转化效果、物料消耗、参与者反馈和下次优化点 | 策划负责人 | 复盘文档/归档资料 |`;
        }

        function buildRiskPlan(analysis) {
            const items = [
                "报名人数不足：提前设置二次宣传节点，并准备社群定向邀请。",
                "现场冷场：准备主持追问话术、低门槛体验任务和可快速展示的成果样例。",
                "场地或设备异常：提前一天测试设备，并准备备用场地或无投影版本流程。",
                "参与者反馈不足：活动结束前现场填写反馈表，避免事后回收率过低。"
            ];
            if (analysis.compositeTopics && analysis.compositeTopics.length) items.unshift("分区失衡风险：若某一板块过热或过冷，现场负责人需引导参与者流向其他分区，并用集章任务平衡动线。");
            if (analysis.isExhibitionBooth) items.unshift("摊位拥堵风险：高峰期采用单向动线和 1 分钟快体验机制，避免参与者停留过久影响后续咨询。");
            if (analysis.isLateNight && analysis.isFoodDrink) items.unshift("时间风险：不建议安排在深夜或过晚时段，应改为下午或傍晚早段，降低返程和身体负担风险。");
            if (analysis.hasSensitiveContent) items.unshift("合规风险：涉及敏感要素时，应先完成审批、资质确认和参与对象边界说明。");
            return items.map((item, i) => `${i + 1}. ${item}`).join("\n");
        }

        function buildBrainstormValueStatement(analysis) {
            if (analysis.isExhibitionBooth) {
                return "策划重点不是把摊位摆满，而是让路过同学在 1-3 分钟内看懂社团、完成一次轻体验，并留下继续了解或报名的明确入口。";
            }
            if (analysis.compositeTopics && analysis.compositeTopics.length) {
                return `策划重点是把${analysis.compositeTopics.join("、")}从并列介绍变成可轮转体验的活动机制，让参与者能比较、选择并形成具体记忆点。`;
            }
            return "策划重点是把抽象主题转化为可操作的参与任务、可衡量的现场反馈和可延续的社群承接。";
        }

        function normalizeAiChatReply(reply, idea) {
            const text = String(reply || "").trim();
            const hasThreeOptions = /(方案|方向|选项).{0,8}(一|1|A)[\s\S]+(方案|方向|选项).{0,8}(二|2|B)[\s\S]+(方案|方向|选项).{0,8}(三|3|C)/.test(text);
            const hasConcretePlay = /玩法|任务|角色|分区|挑战|产出|作品|投票|集章|录制|展示|动线|材料/.test(text);
            if (text.length >= 240 && hasThreeOptions && hasConcretePlay) return text;
            return buildAiConceptOptionsReply(idea);
        }

        function getRecentAiUserContext(limit = 4) {
            return getCurrentAiMessages()
                .filter(message => message.role === "user")
                .slice(-limit)
                .map(message => message.text || "")
                .join("；");
        }

        function getAiBrainstormIntent(text) {
            const clean = String(text || "").trim();
            if (/(方案一|第一个|一号|1号|选一|喜欢一|喜欢第一个|采纳一|采用一)/.test(clean)) return { type: "select", label: "方案一" };
            if (/(方案二|第二个|二号|2号|选二|喜欢二|喜欢第二个|采纳二|采用二)/.test(clean)) return { type: "select", label: "方案二" };
            if (/(方案三|第三个|三号|3号|选三|喜欢三|喜欢第三个|采纳三|采用三)/.test(clean)) return { type: "select", label: "方案三" };
            if (/(结合|融合|调整|修改|细化|展开|继续|更|偏|加入|减少|低预算|高互动|更有趣|更具体|玩法|流程|主题|名字|名称|人数|场地|时间)/.test(clean)) return { type: "refine", label: "当前方向" };
            return { type: "new", label: "" };

                        ? "规模较大时，前期准备、现场控制和收场归档难度都会提高。"
                        : analysis.isFoodDrink
                            ? "食品饮品类活动会增加物资准备、现场清洁和秩序维护工作。"
                            : "活动机制暂未显示明显过高复杂度。"
                }
            ];
            if (analysis.isLateNight && analysis.isFoodDrink) {
                criteria[0].score -= 4;
                criteria[0].reason = "夜间食品饮品类活动需要额外确认场地开放、返程安全和校园管理要求。";
                criteria[2].score -= 5;
                criteria[2].reason = "夜间食品饮品类活动可能影响参与者身体感受、返程体验和报名意愿。";
                criteria[3].score -= 3;
                criteria[3].reason = "夜间活动会提高现场控制、清洁收尾和安全管理难度。";
            }
            if (analysis.hasSensitiveContent) {
                criteria[0].score -= 7;
                criteria[0].reason = "活动包含敏感要素，需要先确认审批、资质、参与对象边界和安全要求。";
                criteria[3].score -= 4;
                criteria[3].reason = "敏感要素会增加前期准备、现场控制和责任划分难度。";
            }
            if (!/时间|地点|人数|对象|预算|场地/.test(analysis.text)) {
                criteria[0].score -= 3;
                criteria[3].score -= 2;
            }
            return criteria.map(c => ({ ...c, score: Math.max(0, Math.min(c.max || 20, c.score)) }));
        }

        function extractExpectedCount(text) {
            const match = String(text || "").match(/(\d{2,5})\s*(人|位|名)/);
            return match ? Number(match[1]) : 0;
        }

        function buildLocalActivityProfile(analysis) {
            return {
                domain: [analysis.isFoodDrink ? "食品饮品" : "", analysis.isStory ? "社交分享" : "", analysis.isCompetition ? "竞赛活动" : "", analysis.isExhibitionBooth ? "社展招新/摊位展示" : ""].filter(Boolean),
                topics: analysis.compositeTopics || [],
                time: analysis.isLateNight ? "夜间" : "未明确或常规时段",
                scale: analysis.explicitCount || (analysis.isLarge ? "大型" : "未明确"),
                audience: analysis.targetAudience,
                specialFactors: [analysis.isFoodDrink ? "食品饮品" : "", analysis.hasSensitiveContent ? "敏感要素" : ""].filter(Boolean),
                riskFactors: analysis.risks
            };
        }

        function buildTriggeredRules(analysis) {
            const rules = [];
            if (analysis.isLateNight && analysis.isFoodDrink) {
                rules.push({
                    rule: "夜间 + 食品饮品",
                    severity: "high",
                    reason: "需要额外考虑返程安全、场地开放时间、身体负担和现场管理。"
                });
            }
            if (analysis.isLarge) {
                rules.push({
                    rule: "大规模活动",
                    severity: "high",
                    reason: "规模较大时，场地容量、组织人员、动线、应急预案都会成为关键约束。"
                });
            }
            if (analysis.hasSensitiveContent) {
                rules.push({
                    rule: "敏感要素 + 审批/资质不明确",
                    severity: "high",
                    reason: "活动涉及可能需要额外审批、资质或安全说明的内容。"
                });
            }
            return rules;
        }

        function buildFeasibilityConclusion(total, analysis, triggeredRules) {
            if (triggeredRules.some(r => r.severity === "critical")) {
                return "不建议按原方案执行，应先调整活动核心设定，再进入策划案细化。";
            }
            if (total >= 85) return "原方案整体可行，可进入执行细化。";
            if (total >= 72) return "原方案可行但需要补足关键条件。";
            if (total >= 58) return "原方案需要重大调整后再考虑执行。";
            return "原方案风险较高，不建议直接执行。";
        }

        function extractThemeFromIdea(idea) {
            const compositeTheme = buildCompositeThemeFromIdea(idea);
            if (compositeTheme) return compositeTheme;
            const named = idea.match(/([A-Za-z0-9\u4e00-\u9fa5 ]{2,24}(分享会|工作坊|沙龙|讲座|比赛|竞赛|展览|晚会|活动))/);
            if (named) {
                let cleaned = named[1].trim();
                for (let i = 0; i < 3; i++) {
                    cleaned = cleaned
                        .replace(/^(我想|想要|想办|办|举办|做|组织|策划|设计)?一?场?/, "")
                        .replace(/^为.{1,24}?(策划|设计|举办|组织)一?场?/, "")
                        .replace(/^在(晚上|夜晚|下午|上午|周末|学校|校园|校内|社团|[^的]{1,12})的?/, "")
                        .replace(/^.+?社团(策划|设计|举办|组织)?一?场?/, "")
                        .replace(/^次/, "")
                        .replace(/^面向.+?的\s*/, "")
                        .trim();
                }
                if (cleaned) return cleaned;
            }
            const short = idea.replace(/[，。,.！!？?]/g, " ").trim().split(/\s+/)[0] || "新活动策划";
            return short.length > 18 ? short.slice(0, 18) + "活动" : short;
        }

        function extractCompositeTopics(text) {
            const normalized = String(text || "").replace(/[,，]/g, "、");
            const patterns = [
                /(?:策划|设计|组织|举办|开展|安排|筹备)(?:一场|一次|一个)?([^。；;：:]{2,80}?(?:、[^。；;：:]{1,24}){1,8})\s*(?:两|三|四|五|六|七|八|九|十|\d+)?个?(?:部门|方向|主题|板块|分区|摊位|项目组|分队|训练方向|环节)/,
                /(?:时|围绕|包括|包含|以|将)?([^。；;：:]{2,80}?(?:、[^。；;：:]{1,24}){1,8})\s*(?:两|三|四|五|六|七|八|九|十|\d+)?个?(?:部门|方向|主题|板块|分区|摊位|项目组|分队|训练方向|环节)/
            ];
            const match = patterns.map(pattern => normalized.match(pattern)).find(Boolean);
            if (!match) return [];
            return match[1]
                .split("、")
                .map(cleanCompositeTopic)
                .filter(item => item && item.length <= 12)
                .slice(0, 8);
        }

        function cleanCompositeTopic(value) {
            return String(value || "")
                .replace(/^.*?(?:百团大战时|百团时|社展时|招新时|活动时|摊位时|时)/, "")
                .replace(/^(为|给|帮|围绕|包括|包含|以)/, "")
                .replace(/(策划|设计|组织|举办|开展|安排|筹备).*/, "")
                .replace(/(?:两|三|四|五|六|七|八|九|十|\d+)个?.*$/, "")
                .replace(/^[\u4e00-\u9fa5A-Za-z0-9]{1,10}(社团|协会|俱乐部|中心|社)(?=[\u4e00-\u9fa5A-Za-z0-9])/, "")
                .trim();
        }

        function buildCompositeThemeFromIdea(idea) {
            const text = String(idea || "").trim();
            const topics = extractCompositeTopics(text);
            if (!topics.length) return "";
            const contextParts = [];
            if (/百团|百团大战/.test(text)) contextParts.push("百团大战");
            if (/社展|摊位|展台/.test(text)) contextParts.push("社展摊位");
            else if (/招新/.test(text)) contextParts.push("招新展示");
            const context = contextParts.length ? contextParts.join("") : "体验活动";
            return `${topics.join("、")}联合${context}`;
        }

        function createActivityNaming(text, flags) {
            const concept = flags.rawTheme || "社团共创活动";
            if (flags.compositeTopics && flags.compositeTopics.length) {
                const clean = trimActivitySuffix(concept);
                return {
                    name: clean.length > 12 ? `${clean.slice(0, 12)}方案` : `${clean}方案`,
                    theme: `围绕${flags.compositeTopics.join("、")}展开的${flags.isExhibitionBooth ? "社展摊位展示、互动体验与成员转化活动" : "联合体验与社团共创活动"}`
                };
            }
            if (/AI|人工智能|工具/.test(text) && /分享|交流|讲/.test(text)) {
                return {
                    name: "AI工具实验室",
                    theme: "面向社团成员的 AI 工具体验、分享与实践活动"
                };
            }
            if (flags.isCompetition) {
                return {
                    name: `${trimActivitySuffix(concept)}挑战赛`,
                    theme: `围绕${trimActivitySuffix(concept)}展开的团队协作与成果展示活动`
                };
            }
            if (flags.isStory) {
                return {
                    name: "故事交换所",
                    theme: "以个人叙事和小组交流促进成员连接的社团活动"
                };
            }
            const clean = trimActivitySuffix(concept);
            return {
                name: clean.length > 10 ? `${clean.slice(0, 10)}计划` : `${clean}计划`,
                theme: `围绕${clean}展开的社团参与体验与共创活动`
            };
        }

        function trimActivitySuffix(value) {
            return String(value || "社团共创")
                .replace(/^(我想|想要|想办|想做|办|做|举办|组织|策划|设计)?一?个?场?/, "")
                .replace(/活动$/, "")
                .replace(/分享会$/, "分享")
                .replace(/工作坊$/, "工作坊")
                .trim() || "社团共创";
        }

        function inferAudience(idea) {
            if (/新生|新成员|招新/.test(idea)) return "社团新成员及对主题感兴趣的潜在成员";
            if (/老师|嘉宾|行业|企业/.test(idea)) return "社团成员、相关专业同学及外部嘉宾";
            if (/亲子|社区/.test(idea)) return "社区居民及亲子家庭";
            return "社团成员及对活动主题感兴趣的同学";
        }


        function applyAiDraftToPlan(mode) {
            ensureAiAssistant();
            const draft = activityData.aiAssistant.draftPlan;
            if (!draft) {
                showToast("请先和 AI 策划助手对话生成拟策划案。");
                return;
            }
            const p = activityData.planSections;
            const write = (key, value) => {
                const trimmed = value ? String(value).trim() : "";
                if (!trimmed) return;
                if (mode === "overwrite" || !p[key] || !String(p[key]).trim()) p[key] = trimmed;
            };

            if (mode === "overwrite" || !activityData.name.trim()) activityData.name = draft.name;
            write("theme", draft.theme);
            write("objective", draft.objective);
            write("dateTime", draft.dateTime);
            write("location", draft.location);
            write("targetAudience", draft.targetAudience);
            write("targetCount", draft.targetCount);
            write("purpose", draft.purpose);
            write("contentFlow", draft.contentFlow);
            write("requirements", draft.requirements);
            write("execution", draft.execution);
            write("riskPlan", draft.riskPlan);

            // 结构化表格：AI 行数组 → 填入；空白表格时才写（非覆盖模式）
            const execRows = getAiExecPlanRows(draft).filter(r => (r.time || "").trim() || (r.name || "").trim() || (r.description || "").trim());
            if (execRows.length) {
                if (mode === "overwrite" || !(p.executionPlan || []).some(r => (r.time || "").trim() || (r.name || "").trim())) {
                    p.executionPlan = execRows;
                }
            }
            const emRows = getAiEmergencyRows(draft).filter(r => (r.response || "").trim());
            if (emRows.length) {
                if (mode === "overwrite" || !(p.emergencyPlan || []).some(r => (r.response || "").trim())) {
                    p.emergencyPlan = emRows;
                }
            }

            activityData.planContent = [draft.objective, draft.targetAudience ? `面向对象：${draft.targetAudience}` : "", draft.dateTime ? `活动时间：${draft.dateTime}` : ""].filter(Boolean).join("\n");

            saveActivityData();
            renderAll();
            showToast(mode === "overwrite" ? "AI 拟策划案已采纳并覆盖当前策划案。" : "AI 拟策划案已填入空白字段。");
        }


        function scrollAiMessages() {
            setTimeout(() => {
                ["aiMiniMessages", "aiFullMessages"].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.scrollTop = el.scrollHeight;
                });
            }, 0);
        }

        function init() {
            // 异步加载资料库活动档案作为 AI 助手「参考活动」（失败静默降级）
            loadArchiveActivities();
            const accountAiHistory = loadAiAssistantAccountHistory();
            if (accountAiHistory) {
                activityData.aiAssistant = {
                    ...activityData.aiAssistant,
                    ...accountAiHistory
                };
            }


            const params = new URLSearchParams(window.location.search);
            const id = params.get("id");
            if (id) {
                // 按活动 id 读取各自独立的草稿数据
                const saved = localStorage.getItem("editActivity:" + id);
                if (saved) {
                    try {
                        const data = JSON.parse(saved);
                        // Map saved fields to activityData
                        if (data.title) activityData.name = data.title;
                        if (data.desc) activityData.planContent = data.desc;
                        if (data.status) {
                            // Pre-complete steps based on status
                            if (data.status === "progress") {
                                for (let i = 0; i <= 4; i++) completedSteps.add(i); // steps 1-5
                            } else if (data.status === "open") {
                                for (let i = 0; i <= 3; i++) completedSteps.add(i); // steps 1-4
                            } else if (data.status === "draft") {
                                completedSteps.add(0); // step 1 only
                            }
                        }
                        // Load any previously saved workflow data
                        if (data.aiPlan) activityData.aiPlan = data.aiPlan;
                        if (data.planContent) activityData.planContent = data.planContent;
                        if (data.planSections) {
                            activityData.planSections = data.planSections;
                            migrateLegacyPlanSections(activityData.planSections);
                        }
                        if (data.budget) activityData.budget = migrateLegacyBudget(data.budget);
                        if (data.checklist) activityData.checklist = data.checklist;
                        if (data.purchaseList) activityData.purchaseList = data.purchaseList;
                        if (data.organizationName !== undefined) activityData.organizationName = data.organizationName;
                        if (data.activityLeader !== undefined) activityData.activityLeader = data.activityLeader;
                        if (data.financePerson !== undefined) activityData.financePerson = data.financePerson;
                        if (data.approvalDate !== undefined) activityData.approvalDate = data.approvalDate;
                        if (data.approvalOpinion !== undefined) activityData.approvalOpinion = data.approvalOpinion;
                        if (data.approvalActivityLeader !== undefined) activityData.approvalActivityLeader = data.approvalActivityLeader;
                        if (data.approved !== undefined) activityData.approved = data.approved;
                        if (data.uploads) activityData.uploads = data.uploads;
                        if (data.reflection) activityData.reflection = data.reflection;
                        if (data.rating) activityData.rating = data.rating;
                        if (data.aiAssistant) {
                            activityData.aiAssistant = {
                                ...activityData.aiAssistant,
                                ...data.aiAssistant,
                                isThinking: false,
                                miniOpen: false,
                                fullscreenOpen: false
                            };
                        }
                        if (data.completedSteps) {
                            data.completedSteps.forEach(i => completedSteps.add(i));
                        }
                    } catch (e) { /* ignore parse errors */ }
                }
                const aiHistory = loadAiAssistantHistory(id);
                if (aiHistory) {
                    activityData.aiAssistant = {
                        ...activityData.aiAssistant,
                        ...aiHistory
                    };
                }
            }
        }

        window.startNewAiConversation = startNewAiConversation;
        window.toggleAiConversationPanel = toggleAiConversationPanel;
        window.sendAiMessage = sendAiMessage;
        window.cancelAiThinking = cancelAiThinking;
        window.respondAiDiscussionAdoption = respondAiDiscussionAdoption;
        window.useAiMessageForPlan = useAiMessageForPlan;
        window.respondAiPlanEditConfirmation = respondAiPlanEditConfirmation;
        window.toggleReservedAdoptionReview = toggleReservedAdoptionReview;
        window.confirmReservedAdoptionReview = confirmReservedAdoptionReview;
        window.openAiFullscreen = openAiFullscreen;
        window.closeAiFullscreen = closeAiFullscreen;
        window.closeAiMiniChat = closeAiMiniChat;
        window.restoreAiConversation = restoreAiConversation;
        window.deleteAiConversation = deleteAiConversation;

        init();
        renderAll();
        bindAiAssistantActions();
        startAiAssistantHealthCheck();
        openArchiveAiPlannerEmbed();
    </script>
</body>
</html>
