<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新建活动 - 活动工作台</title>
    <style>
        :root {
            --bg: #f5f6fa;
            --card-bg: #ffffff;
            --text: #2d3436;
            --text-secondary: #636e72;
            --border: #e0e3eb;
            --primary: #4a6cf7;
            --primary-light: #eef1ff;
            --primary-dark: #3b54d4;
            --success: #10b981;
            --success-light: #e6f9f1;
            --warning: #f59e0b;
            --warning-light: #fff7ed;
            --danger: #ef4444;
            --tag-bg: #f0f2f5;
            --shadow: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 12px 40px rgba(0,0,0,0.12);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.2s ease;
            --sidebar-width: 320px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ── Header ── */
        .header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 14px 28px;
            display: flex;
            align-items: center;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .back-btn {
            width: 34px; height: 34px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: var(--transition);
            text-decoration: none;
        }

        .back-btn:hover { background: #f5f6fa; color: var(--text); }

        .header h1 {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.2px;
        }

        .header .step-indicator {
            margin-left: auto;
            font-size: 13px;
            color: var(--text-secondary);
            background: var(--tag-bg);
            padding: 5px 14px;
            border-radius: 20px;
        }

        .header .step-indicator strong { color: var(--primary); }

        /* ── Layout ── */
        .layout {
            display: flex;
            height: calc(100vh - 63px);
        }

        /* ── Sidebar Timeline ── */
        .sidebar {
            width: var(--sidebar-width);
            flex-shrink: 0;
            background: var(--card-bg);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 8px 0;
            display: flex;
            flex-direction: column;
        }

        .timeline-header {
            padding: 16px 20px 8px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .timeline-progress {
            margin: 0 20px 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .timeline-progress-bar {
            flex: 1;
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
        }

        .timeline-progress-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 3px;
            transition: width 0.4s ease;
        }

        .timeline-progress-text {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .step-nav {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
        }

        .step-nav-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 20px;
            cursor: pointer;
            transition: var(--transition);
            border-left: 3px solid transparent;
            position: relative;
            user-select: none;
        }

        .step-nav-item:hover {
            background: #f8f9fc;
        }

        .step-nav-item.active {
            background: var(--primary-light);
            border-left-color: var(--primary);
        }

        .step-nav-item.completed .step-dot {
            background: var(--success);
            border-color: var(--success);
            color: #fff;
        }

        .step-nav-item.active .step-dot {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }

        .step-nav-item.future {
            opacity: 0.6;
        }

        .step-nav-item.locked {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .step-nav-item.locked:hover {
            background: transparent;
        }

        .step-nav-item.locked .step-dot {
            border-style: dashed;
        }

        .step-dot {
            width: 28px; height: 28px;
            min-width: 28px;
            border-radius: 50%;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            transition: var(--transition);
        }

        .step-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .step-title {
            font-size: 13px;
            font-weight: 500;
            line-height: 1.3;
        }

        .step-hint {
            font-size: 11px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .step-check {
            margin-left: auto;
            font-size: 14px;
            flex-shrink: 0;
        }

        .sidebar-divider {
            margin: 4px 20px;
            border-top: 1px dashed var(--border);
        }

        .optional-section {
            padding: 4px 0 12px;
        }

        .optional-header {
            padding: 8px 20px 4px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ── Main Content ── */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 32px 40px;
        }

        .content-panel {
            max-width: 720px;
            animation: fadeSlideIn 0.25s ease;
        }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .content-panel h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }

        .content-panel .subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 28px;
            line-height: 1.5;
        }

        /* ── Card / Section ── */
        .section-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }

        .section-card h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .section-card label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .input, .textarea, .select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: inherit;
            background: var(--card-bg);
            color: var(--text);
            outline: none;
            transition: var(--transition);
        }

        .input:focus, .textarea:focus, .select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(74,108,247,0.08);
        }

        .textarea {
            resize: vertical;
            min-height: 100px;
            line-height: 1.6;
        }

        .select { cursor: pointer; }

        /* ── Buttons ── */
        .btn {
            padding: 10px 22px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            box-shadow: 0 2px 8px rgba(74,108,247,0.3);
        }

        .btn-outline {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-success {
            background: var(--success);
            color: #fff;
        }

        .btn-success:hover { filter: brightness(1.1); }

        .btn-lg {
            padding: 13px 28px;
            font-size: 15px;
            border-radius: 10px;
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 13px;
            border-radius: 6px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        /* ── AI Output ── */
        .ai-box {
            background: linear-gradient(135deg, #f8faff 0%, #eef1ff 100%);
            border: 1px dashed #b8c4f8;
            border-radius: var(--radius);
            padding: 20px;
            margin-top: 16px;
            font-size: 14px;
            line-height: 1.7;
            color: var(--text);
            display: none;
            white-space: pre-wrap;
        }

        .ai-box.show { display: block; }

        .ai-box .ai-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ai-typing {
            display: none;
            align-items: center;
            gap: 8px;
            color: var(--primary);
            font-size: 13px;
            margin-top: 12px;
        }

        .ai-typing.show { display: flex; }

        .ai-typing .dots span {
            display: inline-block;
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--primary);
            animation: blink 1.4s infinite both;
        }

        .ai-typing .dots span:nth-child(2) { animation-delay: 0.2s; }
        .ai-typing .dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1); }
        }

        /* ── Checklist ── */
        .checklist { list-style: none; }

        .checklist li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        .checklist li:last-child { border-bottom: none; }

        .checklist input[type="checkbox"] {
            width: 18px; height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .checklist .item-done {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        /* ── Budget Table ── */
        .budget-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .budget-table th {
            text-align: left;
            padding: 10px 12px;
            background: #f8f9fc;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 12px;
            border-bottom: 1px solid var(--border);
        }

        .budget-table td {
            padding: 9px 12px;
            border-bottom: 1px solid var(--border);
        }

        .budget-table .total-row td {
            font-weight: 600;
            border-top: 2px solid var(--text);
            border-bottom: none;
            background: #fafbfc;
        }

        .budget-table .input-cell {
            width: 130px;
        }

        .budget-table .input-cell input {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            text-align: right;
        }

        /* ── Upload ── */
        .upload-dropzone {
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 36px 20px;
            text-align: center;
            cursor: pointer;
            color: var(--text-secondary);
            transition: var(--transition);
        }

        .upload-dropzone:hover,
        .upload-dropzone.dragover {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--primary);
        }

        .upload-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .upload-item {
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            overflow: hidden;
            background: #fafbfc;
        }

        .upload-item img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            display: block;
        }

        .upload-item-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 10px;
        }

        .upload-item-name {
            flex: 1;
            font-size: 12px;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .upload-item-remove {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 13px;
            padding: 2px 4px;
            border-radius: 4px;
        }

        .upload-item-remove:hover {
            color: var(--danger);
            background: #fef2f2;
        }

        /* ── Progress ── */
        .progress-steps {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .progress-step {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .progress-step:last-child { border-bottom: none; }

        .progress-radio {
            width: 20px; height: 20px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        /* ── Badge ── */
        .badge-display {
            text-align: center;
            padding: 40px 20px;
        }

        .badge-icon {
            width: 120px; height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #d97706 100%);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 56px;
            box-shadow: 0 8px 32px rgba(245,158,11,0.4);
            animation: badgeAppear 0.6s ease;
        }

        @keyframes badgeAppear {
            from { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.15); }
            to { transform: scale(1); opacity: 1; }
        }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1d2e;
            color: #fff;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 300;
            animation: toastIn 0.3s ease;
            pointer-events: none;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(10px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ── AI Planning Assistant ── */
        .ai-float-wrap {
            position: fixed;
            right: 28px;
            bottom: 28px;
            z-index: 240;
            display: flex;
            align-items: flex-end;
            gap: 12px;
        }

        .ai-float-menu {
            display: none;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 6px;
        }

        .ai-float-wrap:hover .ai-float-menu { display: flex; }

        .ai-menu-btn {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            box-shadow: var(--shadow-md);
            white-space: nowrap;
        }

        .ai-menu-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .ai-float-btn {
            width: 58px;
            height: 58px;
            border-radius: 18px;
            border: none;
            background: var(--primary);
            color: #fff;
            font-size: 26px;
            cursor: pointer;
            box-shadow: 0 10px 28px rgba(74,108,247,0.32);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .ai-float-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .ai-mini-chat {
            position: fixed;
            right: 28px;
            bottom: 98px;
            width: 360px;
            max-width: calc(100vw - 32px);
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            z-index: 245;
            overflow: hidden;
            display: none;
        }

        .ai-mini-chat.show { display: block; }

        .ai-chat-header,
        .ai-full-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            background: #fafbff;
        }

        .ai-chat-title {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .ai-chat-title strong {
            font-size: 14px;
            font-weight: 700;
        }

        .ai-chat-title span {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .ai-chat-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .ai-icon-btn {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text-secondary);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .ai-icon-btn:hover {
            color: var(--primary);
            border-color: var(--primary);
        }

        .ai-messages {
            height: 260px;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #fcfdff;
        }

        .ai-message {
            max-width: 86%;
            border-radius: 12px;
            padding: 9px 12px;
            font-size: 13px;
            line-height: 1.55;
        }

        .ai-message.user {
            align-self: flex-end;
            background: var(--primary);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .ai-message.assistant {
            align-self: flex-start;
            background: var(--tag-bg);
            color: var(--text);
            border-bottom-left-radius: 4px;
        }

        .ai-message.loading {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #eef1ff;
            color: var(--primary);
            font-weight: 500;
        }

        .ai-thinking-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid rgba(74,108,247,0.18);
            border-top-color: var(--primary);
            animation: aiSpin 0.9s linear infinite;
            flex-shrink: 0;
        }

        .ai-thinking-text {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ai-thinking-dots {
            display: inline-flex;
            gap: 3px;
        }

        .ai-thinking-dots span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--primary);
            animation: aiDotPulse 1.2s ease-in-out infinite;
        }

        .ai-thinking-dots span:nth-child(2) { animation-delay: 0.16s; }
        .ai-thinking-dots span:nth-child(3) { animation-delay: 0.32s; }

        @keyframes aiSpin {
            to { transform: rotate(360deg); }
        }

        @keyframes aiDotPulse {
            0%, 80%, 100% { opacity: 0.32; transform: translateY(0); }
            40% { opacity: 1; transform: translateY(-3px); }
        }

        .ai-chat-input {
            display: flex;
            gap: 8px;
            padding: 12px;
            border-top: 1px solid var(--border);
        }

        .ai-chat-input textarea {
            min-height: 44px;
            max-height: 96px;
            resize: vertical;
            flex: 1;
        }

        .ai-fullscreen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 260;
            display: none;
            flex-direction: column;
        }

        .ai-fullscreen.show { display: flex; }

        .ai-full-body {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: 280px minmax(360px, 1fr) 360px;
            gap: 1px;
            background: var(--border);
        }

        .ai-side,
        .ai-main,
        .ai-plan-preview {
            background: var(--card-bg);
            min-height: 0;
            overflow-y: auto;
            padding: 18px;
        }

        .ai-main {
            display: flex;
            flex-direction: column;
            padding: 0;
        }

        .ai-main .ai-messages {
            flex: 1;
            height: auto;
            padding: 20px;
        }

        .ai-panel-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 12px;
        }

        .ai-history-item {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: var(--transition);
        }

        .ai-history-item:hover,
        .ai-history-item.selected {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .ai-history-item strong {
            display: block;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .ai-history-item span,
        .ai-muted {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .ai-conversation-item {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: var(--transition);
            background: #fff;
        }

        .ai-conversation-item:hover {
            border-color: var(--primary);
            background: #fafbff;
        }

        .ai-conversation-item strong {
            display: block;
            font-size: 13px;
            margin-bottom: 4px;
            line-height: 1.35;
        }

        .ai-conversation-time {
            display: block;
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .ai-conversation-empty {
            border: 1px dashed var(--border);
            border-radius: 8px;
            padding: 12px;
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .ai-report-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 14px;
        }

        .ai-report-card {
            background: #f8f9fc;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
        }

        .ai-report-card strong {
            display: block;
            font-size: 18px;
            margin-bottom: 2px;
        }

        .ai-generating-panel {
            border: 1px dashed #b8c4f8;
            background: #f8faff;
            border-radius: 10px;
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--primary);
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .ai-preview-section {
            border-bottom: 1px solid var(--border);
            padding: 12px 0;
        }

        .ai-preview-section:first-of-type { padding-top: 0; }

        .ai-preview-section h4 {
            font-size: 13px;
            margin-bottom: 6px;
        }

        .ai-preview-section p {
            font-size: 13px;
            line-height: 1.65;
            color: var(--text-secondary);
            white-space: pre-wrap;
        }

        /* ── Responsive ── */
        @media (max-width: 860px) {
            .layout { flex-direction: column; }
            .sidebar {
                width: 100%;
                flex-shrink: 0;
                border-right: none;
                border-bottom: 1px solid var(--border);
                max-height: 200px;
                flex-direction: row;
                overflow-x: auto;
                padding: 8px;
            }
            .timeline-header, .timeline-progress { display: none; }
            .timeline-progress-text { display: none; }
            .step-nav {
                display: flex;
                gap: 4px;
                flex-direction: row;
            }
            .step-nav-item {
                flex-direction: column;
                align-items: center;
                padding: 8px 10px;
                border-left: none;
                border-bottom: 3px solid transparent;
                white-space: nowrap;
                min-width: 80px;
                text-align: center;
                gap: 4px;
            }
            .step-nav-item.active { border-left-color: transparent; border-bottom-color: var(--primary); }
            .step-hint { display: none; }
            .step-check { display: none; }
            .content { padding: 20px 16px; }
            .ai-full-body { grid-template-columns: 1fr; }
            .ai-side, .ai-plan-preview { max-height: 34vh; }
        }
    </style>
</head>
<body>
    <!-- ── Header ── -->
    <header class="header">
        <a href="index.html" class="back-btn" title="返回活动列表">←</a>
        <h1 id="headerTitle" onclick="editTitleInline()" style="cursor:pointer;" title="点击编辑活动名称">未命名活动</h1>
        <span class="step-indicator">步骤 <strong id="currentStepNum">1</strong> / 6</span>
        <button class="btn btn-outline btn-sm" onclick="saveDraft()" title="保存当前进度">💾 保存草稿</button>
    </header>

    <!-- ── Layout ── -->
    <div class="layout">
        <!-- Sidebar Timeline -->
        <aside class="sidebar">
            <div class="timeline-header">活动流程</div>
            <div class="timeline-progress">
                <div class="timeline-progress-bar">
                    <div class="timeline-progress-fill" id="globalProgress" style="width:0%"></div>
                </div>
                <span class="timeline-progress-text" id="progressText">0 / 6</span>
            </div>
            <nav class="step-nav" id="stepNav"></nav>
            <div class="sidebar-divider"></div>
            <div class="optional-section">
                <div class="optional-header">选填</div>
                <div class="step-nav-item" id="reflectionNav" onclick="goToReflection()">
                    <span class="step-dot" style="border-style:dashed;">🪞</span>
                    <span class="step-info">
                        <span class="step-title">Reflection 复盘</span>
                        <span class="step-hint">总结经验教训</span>
                    </span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="content" id="mainContent"></main>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast" style="display:none"></div>

    <!-- AI Planning Assistant -->
    <div class="ai-float-wrap" id="aiFloatWrap">
        <div class="ai-float-menu">
            <button class="ai-menu-btn" onclick="openAiMiniChat()">展开对话</button>
            <button class="ai-menu-btn" onclick="closeAiFloat()">关闭浮标</button>
        </div>
        <button class="ai-float-btn" onclick="openAiMiniChat()" title="AI 策划助手">AI</button>
    </div>

    <section class="ai-mini-chat" id="aiMiniChat" aria-label="AI 策划助手小窗"></section>
    <section class="ai-fullscreen" id="aiFullscreen" aria-label="AI 策划助手主界面"></section>

    <script>
        // ── Step Definitions ──
        const steps = [
            {
                num: 1,
                title: "输出策划案",
                hint: "完善活动策划方案",
                icon: "📝",
                render() { return renderStep1(); }
            },
            {
                num: 2,
                title: "编制预算案",
                hint: "制定活动预算",
                icon: "💰",
                render() { return renderStep2(); }
            },
            {
                num: 3,
                title: "审批流程或导出文件",
                hint: "提交审批",
                icon: "📋",
                render() { return renderStep3(); }
            },
            {
                num: 4,
                title: "采购Checklist",
                hint: "按清单采购物资",
                icon: "📦",
                render() { return renderStep4(); }
            },
            {
                num: 5,
                title: "活动资料上传",
                hint: "上传活动图片资料",
                icon: "📷",
                render() { return renderStep5(); }
            },
            {
                num: 6,
                title: "活动完成",
                hint: "标记完成状态",
                icon: "✅",
                render() { return renderStep6(); }
            }
        ];

        // ── State ──
        let currentStep = 0;          // 0-indexed
        let completedSteps = new Set();
        let activityData = {
            name: "",
            type: "音乐节",
            aiPlan: "",
            planContent: "",
            planSections: {
                // 一、活动名称（见 activityData.name，与页首标题同步）
                // 二、主题
                theme: "",
                slogan: "",
                // 三、目的
                objective: "",
                // 四、基本信息
                dateTime: "",
                backupDate: "",
                location: "",
                needVenueBooking: "否",
                venueBookings: [],
                partner: "",
                targetAudience: "",
                // 五、预计参与人数
                targetCount: "",
                maxCount: "",
                composition: "",
                // 六、活动执行方案
                executionPlan: [],
                // 七、基础物资需求（可选 — 大型活动需社联/学校支持）
                basicMaterials: [],
                // 八、执行方案 — 人员与时间节点（可选）
                procurementTime: "",
                procurementPerson: "",
                procurementStandard: "",
                onSiteManager: "",
                // 八、执行方案 — 物资归还
                returnPlan: "",
                returnPerson: "",
                returnPhone: "",
                returnWechat: "",
                // 财务 & 复盘
                financePlan: "",
                reviewPlan: "",
                // 九、应急预案
                emergencyPlan: [],
                // 十、宣传方式（可选）
                publicityPre: "",
                publicityPost: ""
            },
            // ── 经费申请表（第二步）──
            organizationName: "",
            activityLeader: "",
            financePerson: "",
            approvalDate: "",
            approvalOpinion: "",
            approvalActivityLeader: "",
            budget: [
                { name: "", unitPrice: "", unit: "", quantity: "", reusable: "否", purpose: "", purchaseLink: "" }
            ],
            approved: false,
            purchaseList: [],
            checklist: [],
            archived: false,
            badgeEarned: false,
            uploads: [],
            progress: {},
            reflection: "",
            aiAssistant: {
                floatVisible: true,
                miniOpen: false,
                fullscreenOpen: false,
                ideaInput: "",
                selectedHistoryIds: [],
                messages: [
                    {
                        role: "assistant",
                        text: "你好，我是 AI 策划助手。你可以先用一句话告诉我活动想法，我会帮你追问、评估可行性，并生成可采纳到策划案的草稿。"
                    }
                ],
                feasibilityReport: null,
                draftPlan: null,
                isThinking: false
            }
        };

        // ── Render Sidebar ──
        function renderSidebar() {
            const nav = document.getElementById("stepNav");
            nav.innerHTML = steps.map((s, i) => {
                let cls = "";
                let lock = false;
                if (completedSteps.has(i)) cls = "completed";
                else if (i === currentStep) cls = "active";
                else if (!canAccessStep(i)) { cls = "locked"; lock = true; }
                else cls = "future";
                return `
                <div class="step-nav-item ${cls}" onclick="goToStep(${i})">
                    <span class="step-dot">${completedSteps.has(i) ? '✓' : (lock ? '🔒' : s.num)}</span>
                    <span class="step-info">
                        <span class="step-title">${s.icon} ${s.title}</span>
                        <span class="step-hint">${lock ? lockedReason(i) : s.hint}</span>
                    </span>
                    ${completedSteps.has(i) ? '<span class="step-check" style="color:var(--success)">✓</span>' : ''}
                </div>`;
            }).join('');

            document.getElementById("currentStepNum").textContent = currentStep + 1;

            const pct = Math.round((completedSteps.size / steps.length) * 100);
            document.getElementById("globalProgress").style.width = pct + "%";
            document.getElementById("progressText").textContent = `${completedSteps.size} / ${steps.length}`;
        }

        // ── Step validation ──
        function isStepValid(index) {
            const p = activityData.planSections;
            switch (index) {
                case 0: // 输出策划案 — 必填：活动名称、主题、目的、时间、地点、目标人数、执行方案、应急预案
                    return !!(activityData.name && activityData.name.trim() &&
                        p.theme && p.theme.trim() &&
                        p.objective && p.objective.trim() &&
                        p.dateTime && p.dateTime.trim() &&
                        p.location && p.location.trim() &&
                        p.targetCount && p.targetCount.trim() &&
                        p.executionPlan && p.executionPlan.length > 0 && p.executionPlan.some(r => (r.time || "").trim() || (r.name || "").trim()) &&
                        p.emergencyPlan && p.emergencyPlan.length > 0 && p.emergencyPlan.some(r => (r.response || "").trim()));
                case 1: // 编制预算案 — 必填：组织名称、活动负责人 + 至少一项有效预算明细
                    return !!((activityData.organizationName || "").trim() &&
                        (activityData.activityLeader || "").trim() &&
                        activityData.budget.length > 0 &&
                        activityData.budget.some(b => (b.name || "").trim() && (parseFloat(b.unitPrice) || 0) > 0));
                case 2: // 审批流程或导出文件 — 导出文件后即完成
                    return true;
                case 3: // 采购清单 — 至少一项物品名称已填写
                    return activityData.purchaseList && activityData.purchaseList.length > 0
                        && activityData.purchaseList.some(r => (r.name || "").trim());
                case 4: // 活动资料上传
                    return activityData.uploads && activityData.uploads.length > 0;
                case 5: // 活动完成
                    return true; // controlled by checkbox in UI
                default: return false;
            }
        }

        function canAccessStep(index) {
            if (index <= 1) return true;
            return completedSteps.has(0) && completedSteps.has(1) && completedSteps.has(index - 1);
        }

        function lockedReason(index) {
            if (!completedSteps.has(0) || !completedSteps.has(1)) {
                return "先确认「输出策划案」和「编制预算案」";
            }
            return `先确认上一步「${steps[index - 1].title}」`;
        }

        function goToStep(index) {
            if (!canAccessStep(index)) {
                showToast("🔒 " + lockedReason(index));
                return;
            }
            currentStep = index;
            renderAll();
            document.getElementById("mainContent").scrollTop = 0;
        }

        // ── Save draft ──
        function ensureActivityId() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get("id");
            if (!id) {
                // New activity: assign a temporary id so draft can be saved
                const newId = "draft_" + Date.now();
                window.history.replaceState(null, "", "?id=" + newId);
                return newId;
            }
            return id;
        }

        function saveDraft() {
            ensureActivityId();
            saveActivityData();
            showToast("💾 草稿已保存");
        }

        // ── Persist workflow data to localStorage ──
        function saveActivityData() {
            const id = ensureActivityId();
            if (id) {
                const existing = JSON.parse(localStorage.getItem("editActivity") || "{}");
                const aiSnapshot = getSerializableAiAssistant();
                const data = {
                    ...existing,
                    ...activityData,
                    aiAssistant: aiSnapshot,
                    title: activityData.name,
                    desc: activityData.planContent,
                    completedSteps: Array.from(completedSteps)
                };
                localStorage.setItem("editActivity", JSON.stringify(data));
                saveAiAssistantHistory(id);
            }
        }

        function getCurrentActivityId() {
            const params = new URLSearchParams(window.location.search);
            return params.get("id") || "";
        }

        function saveAiAssistantHistory(id) {
            ensureAiAssistant();
            if (!id || !activityData.aiAssistant) return;
            localStorage.setItem(`aiAssistantHistory:${id}`, JSON.stringify(getSerializableAiAssistant()));
        }

        function getSerializableAiAssistant() {
            ensureAiAssistant();
            return {
                ...activityData.aiAssistant,
                isThinking: false,
                messages: (activityData.aiAssistant.messages || []).filter(m => !m.loading)
            };
        }

        function loadAiAssistantHistory(id) {
            if (!id) return null;
            const raw = localStorage.getItem(`aiAssistantHistory:${id}`);
            if (!raw) return null;
            try {
                const data = JSON.parse(raw);
                return {
                    ...data,
                    isThinking: false,
                    miniOpen: false,
                    fullscreenOpen: false,
                    messages: Array.isArray(data.messages) && data.messages.length ? data.messages.filter(m => !m.loading) : undefined
                };
            } catch (e) {
                return null;
            }
        }

        function completeStep(index) {
            if (!isStepValid(index)) {
                showToast("⚠️ 请填写当前步骤的所有必填内容后再完成");
                return;
            }
            completedSteps.add(index);
            // 活动完成（第 6 步）→ 通知父窗口（Vue 平台）记录活动并询问是否复盘
            if (index === 5 && window.parent) {
                window.parent.postMessage({
                    type: 'activity-completed',
                    title: activityData.name,
                    photo: (activityData.uploads && activityData.uploads.length) ? activityData.uploads[0].dataUrl : ''
                }, '*');
            }
            saveActivityData();
            if (index < steps.length - 1) {
                const next = index + 1;
                if (canAccessStep(next)) {
                    showToast(`✅ 「${steps[index].title}」已完成，进入下一步`);
                    currentStep = next;
                } else {
                    showToast(`✅ 「${steps[index].title}」已完成。${lockedReason(next)}`);
                }
            } else {
                showToast("🎉 全部流程已完成！活动完美闭环！");
            }
            renderAll();
            document.getElementById("mainContent").scrollTop = 0;
        }

        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                renderAll();
                document.getElementById("mainContent").scrollTop = 0;
            }
        }

        function renderAll() {
            renderSidebar();
            const content = document.getElementById("mainContent");
            content.innerHTML = `<div class="content-panel">${steps[currentStep].render()}</div>`;
            updateHeaderTitle();
            renderAiAssistant();
        }

        function updateHeaderTitle() {
            const h = document.getElementById("headerTitle");
            if (activityData.name.trim()) {
                h.textContent = activityData.name.trim();
                h.style.color = "";
                document.title = activityData.name.trim() + " - 活动工作台";
            } else {
                h.textContent = "未命名活动 — 点击命名";
                h.style.color = "var(--text-secondary)";
                document.title = "新建活动 - 活动工作台";
            }
        }

        function editTitleInline() {
            const current = activityData.name.trim() || "";
            const input = document.createElement("input");
            input.value = current;
            input.placeholder = "输入活动名称...";
            input.style.cssText = "font-size:17px;font-weight:600;border:1px solid var(--primary);border-radius:8px;padding:6px 12px;width:300px;font-family:inherit;outline:none;";
            const h = document.getElementById("headerTitle");
            h.replaceWith(input);
            input.focus();
            input.select();
            input.addEventListener("blur", () => {
                activityData.name = input.value.trim();
                const newH = document.createElement("h1");
                newH.id = "headerTitle";
                newH.onclick = editTitleInline;
                newH.style.cursor = "pointer";
                newH.title = "点击编辑活动名称";
                input.replaceWith(newH);
                updateHeaderTitle();
                renderAll();
            });
            input.addEventListener("keydown", (e) => {
                if (e.key === "Enter") input.blur();
                if (e.key === "Escape") { input.value = current; input.blur(); }
            });
        }

        function goToReflection() {
            // Reflection 复盘由父窗口（Vue 平台的复盘流程：评分/AI 提炼/成长等级）接管
            if (window.parent) {
                window.parent.postMessage({ type: 'open-reflection' }, '*');
            }
        }

        function showToast(msg) {
            const t = document.getElementById("toast");
            t.textContent = msg;
            t.style.display = "block";
            clearTimeout(t._timeout);
            t._timeout = setTimeout(() => { t.style.display = "none"; }, 2500);
        }

        // ═══════════════════════════════════════════════
        // STEP 1: 输出策划案
        // ═══════════════════════════════════════════════
        function renderStep1() {
            const done = completedSteps.has(0);
            const p = activityData.planSections;

            // ── Lazy init defaults for empty arrays ──
            if (!p.executionPlan || p.executionPlan.length === 0) {
                p.executionPlan = [
                    { time: "", name: "", format: "", description: "" },
                    { time: "", name: "", format: "", description: "" }
                ];
            }
            if (!p.basicMaterials || p.basicMaterials.length === 0) {
                p.basicMaterials = [
                    { type: "桌椅", needs: "桌子", quantity: "1", unit: "张", requirements: "" },
                    { type: "电力设备", needs: "插排/接线板", quantity: "", unit: "个", requirements: "" },
                    { type: "其他设备", needs: "白板/投影仪/音响", quantity: "", unit: "套", requirements: "" },
                    { type: "场地支持", needs: "清洁工具/垃圾袋", quantity: "", unit: "套", requirements: "" }
                ];
            }
            if (!p.venueBookings || p.venueBookings.length === 0) {
                p.venueBookings = [
                    { orgName: "", activityName: "", bookingDate: "", timeSlot: "", venue: "", headcount: "", dept: "", floorPlan: "", email: "" }
                ];
            }
            if (!p.emergencyPlan || p.emergencyPlan.length === 0) {
                p.emergencyPlan = [
                    { risk: "天气突变（户外活动）", response: "", person: "" },
                    { risk: "设备故障", response: "", person: "" },
                    { risk: "人员缺席", response: "", person: "" },
                    { risk: "安全问题", response: "", person: "" },
                    { risk: "参与度不足", response: "", person: "" }
                ];
            }

            // ── 应急预案示例（按风险类型作为占位提示，不填入内容）──
            const emergencyExamples = {
                "天气突变（户外活动）": "提前准备雨棚/转至室内备用场地",
                "设备故障": "备用投影仪/手动扩音器/技术支援电话",
                "人员缺席": "机动人员顶岗/简化非核心环节",
                "安全问题": "现场急救包",
                "参与度不足": "临时增加抽奖"
            };

            // ── Progress indicators ──
            const hasExecPlan = p.executionPlan.some(r => (r.time || "").trim() || (r.name || "").trim());
            const hasEmergency = p.emergencyPlan.some(r => (r.response || "").trim());
            const filledRequired = [activityData.name, p.theme, p.objective, p.dateTime, p.location, p.targetCount].filter(v => v && v.trim()).length;

            // ── Format helpers for table inputs ──
            const escQ = (v) => esc(v || "");

            return `
            <h2>📝 输出策划案</h2>
            <p class="subtitle">按照以下十个部分完善活动策划方案。标记 <span style="background:#fff7ed;color:#d97706;padding:1px 8px;border-radius:10px;font-size:11px;">可选</span> 的为选填项，可留空。</p>

            <!-- ═══ 一、活动名称 ═══ -->
            <div class="section-card">
                <h3>一、活动名称 <span style="color:var(--danger);">*</span></h3>
                <div style="display:flex;flex-direction:column;gap:14px;">
                    <div>
                        <label>活动名称 <span style="color:var(--danger);">*</span></label>
                        <input class="input" placeholder="填写活动正式名称"
                               value="${escQ(activityData.name)}"
                               oninput="activityData.name=this.value;updateHeaderTitle();">
                    </div>
                </div>
            </div>

            <!-- ═══ 二、主题 ═══ -->
            <div class="section-card">
                <h3>二、主题</h3>
                <div style="display:flex;flex-direction:column;gap:14px;">
                    <div>
                        <label>核心主题 <span style="color:var(--danger);">*</span></label>
                        <input class="input" placeholder="用一句话凝练活动主题，需具有吸引力且契合目的"
                               value="${escQ(p.theme)}"
                               oninput="activityData.planSections.theme=this.value">
                    </div>
                    <div>
                        <label>副标题 / Slogan <span style="background:#fff7ed;color:#d97706;padding:1px 8px;border-radius:10px;font-size:11px;">可选</span></label>
                        <input class="input" placeholder="辅助说明主题的短句或口号"
                               value="${escQ(p.slogan)}"
                               oninput="activityData.planSections.slogan=this.value">
                    </div>
                </div>
            </div>

            <!-- ═══ 三、目的 ═══ -->
            <div class="section-card">

            <!-- ═══ 审批栏 ═══ -->

        // 预算行输入：只更新数据与合计显示，不整页重绘，避免输入框失去焦点闪屏
        function updateBudgetRow(index) {
            const row = activityData.budget[index];
            if (!row) return;
            const calcRowTotal = (r) => (parseFloat(r.unitPrice) || 0) * (parseFloat(r.quantity) || 0);
            const rowTotal = calcRowTotal(row);
            const rowEl = document.getElementById("budgetRowTotal" + index);
            if (rowEl) rowEl.textContent = rowTotal > 0 ? rowTotal.toLocaleString() : "—";
            const grandTotal = activityData.budget.reduce((s, r) => s + calcRowTotal(r), 0);
            const totalEl = document.getElementById("budgetGrandTotal");
            if (totalEl) totalEl.textContent = "¥ " + grandTotal.toLocaleString();
            const btn = document.getElementById("budgetConfirmBtn");
            if (btn && !completedSteps.has(1)) {
                btn.textContent = `确认预算（合计 ¥${grandTotal.toLocaleString()}）→`;
            }
            const progEl = document.getElementById("budgetProgressTotal");
            if (progEl) progEl.innerHTML = `<strong>¥ ${grandTotal.toLocaleString()}</strong>`;
            const hasValid = activityData.budget.some(b => (b.name || "").trim() && (parseFloat(b.unitPrice) || 0) > 0);
            const validEl = document.getElementById("budgetProgressValid");
            if (validEl) validEl.textContent = hasValid ? "✅" : "⚠️ 请至少添加一项有单价和名称的物品";
        }

        function handleImageFiles(fileList) {
            const files = Array.from(fileList).filter(f => f.type.startsWith("image/"));
            if (!files.length) {
                showToast("⚠️ 请选择图片文件");
                return;
            }
            if (!activityData.uploads) activityData.uploads = [];
            let pending = files.length;
            const added = [];
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        added.push({ name: file.name, dataUrl: resizeImage(img) });
                        finish();
                    };
                    img.onerror = finish;
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
            function finish() {
                if (--pending !== 0) return;
                if (added.length) {
                    activityData.uploads.push(...added);
                    showToast(`✅ 已上传 ${added.length} 张图片`);
                }
                renderAll();
            }
        }

        // 压缩/缩放图片（最长边 1280px），避免大图撑爆 localStorage
        function resizeImage(img) {
            const MAX = 1280;
            let w = img.naturalWidth || img.width;
            let h = img.naturalHeight || img.height;
            if (w > MAX || h > MAX) {
                const ratio = Math.min(MAX / w, MAX / h);
                w = Math.round(w * ratio);
                h = Math.round(h * ratio);
            }
            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            return canvas.toDataURL("image/jpeg", 0.85);
        }

        function removeUpload(index) {
            activityData.uploads.splice(index, 1);
            showToast("已删除图片");
            renderAll();
        }

                messages: [
                    {
                        role: "assistant",
                        text: "你好，我是 AI 策划助手。你可以先用一句话告诉我活动想法，我会帮你追问、评估可行性，并生成可采纳到策划案的草稿。"

        function repairAiAssistantState() {
            const ai = activityData.aiAssistant;
            const hasLoading = Array.isArray(ai.messages) && ai.messages.some(m => m.loading);
            ai.isThinking = !!hasLoading;

            const messages = Array.isArray(ai.messages) ? ai.messages : [];
            const lastUserIndex = messages.map(m => m.role).lastIndexOf("user");
            const hasAssistantAfterLastUser = lastUserIndex >= 0 && messages.slice(lastUserIndex + 1).some(m => m.role === "assistant" && !m.loading);
            if (!ai.draftPlan && hasAssistantAfterLastUser) {
                const lastIdea = getLastUserIdea();
                ai.draftPlan = buildAiDraftPlan(lastIdea);
                ai.feasibilityReport = ai.feasibilityReport || buildAiFeasibilityReport(lastIdea);
            }
        }

        function isAiThinking() {
            ensureAiAssistant();
            return activityData.aiAssistant.messages.some(m => m.loading);
        }

        function getLastUserIdea() {
            const messages = activityData.aiAssistant.messages || [];
            for (let i = messages.length - 1; i >= 0; i--) {
                if (messages[i].role === "user") return messages[i].text || activityData.aiAssistant.ideaInput || "新活动策划";
            }

        function getAiConversationRecords() {
            ensureAiAssistant();
            const messages = activityData.aiAssistant.messages || [];
            const records = [];
            messages.forEach((message, index) => {
                if (message.role !== "user") return;
                const nextAssistant = messages.slice(index + 1).find(m => m.role === "assistant" && !m.loading);
                records.push({
                    messageIndex: index,
                    title: summarizeText(message.text, 28),
                    timeText: formatAiMessageTime(message.createdAt),
                    preview: nextAssistant ? summarizeText(nextAssistant.text, 52) : "AI 尚未完成回复，可点击恢复这条想法继续生成。"
                });
            });
            return records.reverse();
        }

            if (!message || message.role !== "user") return;
            activityData.aiAssistant.ideaInput = message.text;
            activityData.aiAssistant.draftPlan = buildAiDraftPlan(message.text);
            activityData.aiAssistant.feasibilityReport = buildAiFeasibilityReport(message.text);
            saveActivityData();
            renderAiAssistant();

        function summarizeText(text, maxLen) {
            const clean = String(text || "").replace(/\s+/g, " ").trim();
            if (!clean) return "未命名想法";

            return date.toLocaleString("zh-CN", {

        async function sendAiMessage(source) {
            ensureAiAssistant();
            if (isAiThinking()) return;
            const input = document.getElementById(source === "full" ? "aiFullInput" : "aiMiniInput");
            const text = input.value.trim();
            if (!text) return;
            input.value = "";

            const ai = activityData.aiAssistant;
            ai.isThinking = true;
            ai.ideaInput = text;
            ai.messages.push({ role: "user", text, createdAt: new Date().toISOString() });

            const pendingIndex = ai.messages.push({
                role: "assistant",
                text: "已发送到本地代理，正在等待 DeepSeek 返回",
                loading: true,
                createdAt: new Date().toISOString()
            }) - 1;
            renderAiAssistant();
            saveActivityData();

            try {
                const result = await requestDeepSeekPlan(text);
                ai.draftPlan = normalizeAiDraftPlan(result.draftPlan || result.draft || {}, text);
                ai.feasibilityReport = normalizeAiFeasibilityReport(result.feasibilityReport || result.report || {}, text);
                ai.messages[pendingIndex] = {
                    role: "assistant",
                    text: result.reply || "DeepSeek 已生成拟策划案和可行性评估。你可以先检查右侧预览，再选择填入空白项或采纳到策划案。",
                    createdAt: new Date().toISOString()
                };
            } catch (error) {
                const draft = buildAiDraftPlan(text);
                ai.draftPlan = draft;
                ai.feasibilityReport = buildAiFeasibilityReport(text);
                ai.messages[pendingIndex] = {
                    role: "assistant",
                    text: `DeepSeek 暂时没有返回结果，已先用本地规则生成一版草稿。原因：${error.message}`,

            } finally {
                ai.isThinking = false;
