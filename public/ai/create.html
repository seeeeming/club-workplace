        // ── 采购清单：确认按钮状态（全部到货 + 已填放置位置）──
        function purchaseConfirmState(done) {
            const items = (activityData.purchaseList || []).filter(r => (r.name || "").trim());
            const pendingStatusCount = items.filter(r => r.status !== '已到货').length;
            const missingLocationCount = items.filter(r => r.status === '已到货' && !(r.location || "").trim()).length;
            const allReady = items.length > 0 && items.every(r => r.status === '已到货' && (r.location || "").trim());
            let label;
            if (done) label = '✓ 已完成';
            else if (items.length === 0) label = '请先添加物资';
            else if (pendingStatusCount > 0) label = `还有 ${pendingStatusCount} 项未到货`;
            else if (missingLocationCount > 0) label = `还有 ${missingLocationCount} 项未填放置位置`;
            else label = '确认采购清单 →';
            return { allReady, label };
        }

        // 输入放置位置时原地更新按钮，不整页重渲染（避免闪屏/失焦）
        function updateConfirmButton() {
            const btn = document.getElementById("confirmPurchaseBtn");
            if (!btn) return;
            const done = completedSteps.has(3);
            const { label } = purchaseConfirmState(done);
            btn.textContent = label;
        }

        // 切换状态时原地更新：该行放置位置显隐 + 统计数字 + 确认按钮，不整页重渲染
        function onPurchaseStatusChange(i, selectEl) {
            activityData.purchaseList[i].status = selectEl.value;
            const loc = document.getElementById("purchaseLoc-" + i);
            if (loc) {
                loc.style.display = (selectEl.value === '已到货') ? '' : 'none';
            }
            updatePurchaseStats();
            updateConfirmButton();
        }

        function updatePurchaseStats() {
            const counts = { '待采购': 0, '已下单': 0, '已到货': 0 };
            (activityData.purchaseList || []).forEach(r => { if (counts[r.status] !== undefined) counts[r.status]++; });
            const pending = document.getElementById("purchasePendingCount");
            const ordered = document.getElementById("purchaseOrderedCount");
            const arrived = document.getElementById("purchaseArrivedCount");
            if (pending) pending.textContent = counts['待采购'];
            if (ordered) ordered.textContent = counts['已下单'];
            if (arrived) arrived.textContent = counts['已到货'];
        }

        // ── 采购清单：多选物资批量设置状态 ──
        function updatePurchaseSelectedCount() {
            const n = document.querySelectorAll(".purchase-check:checked").length;
            const el = document.getElementById("purchaseSelectedCount");
            if (el) el.textContent = n;
            const all = document.getElementById("purchaseCheckAll");
            if (all) {
                const total = document.querySelectorAll(".purchase-check").length;
                all.checked = total > 0 && n === total;
                all.indeterminate = n > 0 && n < total;
            }
        }

        function toggleAllPurchaseChecks(checked) {
            document.querySelectorAll(".purchase-check").forEach(c => { c.checked = checked; });
            updatePurchaseSelectedCount();
        }

        function applyBatchPurchaseStatus() {
            const statusEl = document.getElementById("purchaseBatchStatus");
            const status = statusEl ? statusEl.value : "待采购";
            const checks = Array.from(document.querySelectorAll(".purchase-check:checked"));
            if (!checks.length) {
                showToast("请先勾选要设置的物资");
                return;
            }
            checks.forEach(c => {
                const i = Number(c.dataset.index);
                const row = activityData.purchaseList[i];
                if (!row) return;
                row.status = status;
                const sel = document.getElementById("purchaseStatus-" + i);
                if (sel) sel.value = status;
                const loc = document.getElementById("purchaseLoc-" + i);
                if (loc) loc.style.display = status === "已到货" ? "" : "none";
            });
            updatePurchaseStats();
            updateConfirmButton();
            showToast(`已批量设置 ${checks.length} 件物资为「${status}」`);
        }

            }

                activityData.purchaseList = activityData.budget

                            </tr>
                        </thead>
                        <tbody>
                            ${activityData.purchaseList.map((r, i) => `

                                <td style="padding:6px 10px;border-bottom:1px solid var(--border);text-align:center;">

                                           value="${escQ(r.name)}"
                                           oninput="activityData.purchaseList[${i}].name=this.value; updateConfirmButton()">
                                </td>
                                <td style="padding:6px 10px;border-bottom:1px solid var(--border);">
                                    <select id="purchaseStatus-${i}" data-field="purchase.status.${i}" style="font-size:12px;padding:4px 6px;border-radius:6px;border:1px solid var(--border);width:100%;"

                                        <option value="已下单" ${r.status === '已下单' ? 'selected' : ''}>已下单</option>
                                        <option value="已到货" ${r.status === '已到货' ? 'selected' : ''}>已到货</option>
                                    </select>
                                    <input id="purchaseLoc-${i}" data-field="purchase.loc.${i}" class="input" style="width:100%;padding:4px 6px;font-size:11px;margin-top:4px;${r.status === '已到货' ? '' : 'display:none;'}" placeholder="放置位置"
                                           value="${escQ(r.location)}"
                                           oninput="activityData.purchaseList[${i}].location=this.value; updateConfirmButton()">
                                </td>
                                <td style="padding:6px 4px;border-bottom:1px solid var(--border);text-align:center;">
                                    <button style="background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:14px;"
                                            onclick="activityData.purchaseList.splice(${i},1);renderAll();"
                                            title="删除此行">✕</button>
                                </td>
                            </tr>`).join('')}
                        </tbody>
                    </table>
                </div>
                <button class="btn btn-outline btn-sm" style="margin-top:10px;"

                </div>
            </div>` : `
            <div style="font-size:13px;color:var(--text-secondary);padding:0 4px;">

            </div>`}

                </button>
            </div>`;
        }

        function handleImageFiles(fileList) {
            const files = Array.from(fileList).filter(f => f.type.startsWith("image/"));
            if (!files.length) {
                showToast("⚠️ 请选择图片文件");
                return;
            }
            if (!activityData.uploads) activityData.uploads = [];
            let pending = files.length;
            const added = [];
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        added.push({ name: file.name, dataUrl: resizeImage(img) });
                        finish();
                    };
                    img.onerror = finish;
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
            function finish() {
                if (--pending !== 0) return;
                if (added.length) {
                    activityData.uploads.push(...added);
                    showToast(`✅ 已上传 ${added.length} 张图片`);
                }
                renderAll();
            }
        }

        // 压缩/缩放图片（最长边 1280px），避免大图撑爆 localStorage
        function resizeImage(img) {
            const MAX = 1280;
            let w = img.naturalWidth || img.width;
            let h = img.naturalHeight || img.height;
            if (w > MAX || h > MAX) {
                const ratio = Math.min(MAX / w, MAX / h);
                w = Math.round(w * ratio);
                h = Math.round(h * ratio);
            }
            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            return canvas.toDataURL("image/jpeg", 0.85);
        }

        function removeUpload(index) {
            activityData.uploads.splice(index, 1);
            showToast("已删除图片");

        // ── Helpers ──
        function esc(s) {
            if (!s) return "";
            const el = document.createElement("span");

            return el.innerHTML;
        }

        // ═══════════════════════════════════════════════
        // 时间轮盘：活动执行方案「时间节点」选择器
        // 存储格式保持 "HH:MM-HH:MM" 字符串，与导出/预览/解析逻辑兼容
        // ═══════════════════════════════════════════════
        let twState = null; // { index, start, end(分钟), mode, lastMinInHalf, dragStartRaw, dragStartVal }

        const twFmt = (m) => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;

        /** 分钟 → 「1小时30分」/「45分钟」 */
        function twDur(m) {
            m = Math.round(m);
            if (m < 60) return `${m}分钟`;
            const h = Math.floor(m / 60), mm = m % 60;
            return mm ? `${h}小时${mm}分` : `${h}小时`;
        }

        /** 表盘角度（分钟，12 点方向为 0°）→ 圆上坐标 */
        function twPolar(min, r) {
            const rad = (min * 0.5 - 90) * Math.PI / 180;
            return [140 + r * Math.cos(rad), 140 + r * Math.sin(rad)];
        }

        /** 区间弧带 path：开始 → 结束（顺时针，超过 12 小时用大弧） */
        function twArcPath(start, end) {
            const [x1, y1] = twPolar(start % 720, 127);
            const [x2, y2] = twPolar(end % 720, 127);
            const large = (end - start) > 360 ? 1 : 0;
            return `M ${x1.toFixed(2)} ${y1.toFixed(2)} A 127 127 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;
        }

        /** 720 分钟圆环上的最短距离 */
        const twCircDist = (a, b) => { const d = Math.abs(a - b) % 720; return Math.min(d, 720 - d); };

        function parseTwRange(s) {
            const range = String(s || "").match(/(\d{1,2})[:：](\d{1,2})\s*[-–—~～至]\s*(\d{1,2})[:：](\d{1,2})/);
            if (range) {
                const start = +range[1] * 60 + +range[2];
                let end = +range[3] * 60 + +range[4];
                if (end < start) end += 1440; // 跨天（如 23:30-01:00）按次日计算
                return { start, end }; // 支持超过 24 小时（如 26:30）
            }
            const single = String(s || "").match(/(\d{1,2})[:：](\d{1,2})/);
            if (single) {
                const t = +single[1] * 60 + +single[2];
                return { start: t, end: t };
            }
            return null;
        }

        function twClearRow(index) {
            const row = activityData.planSections.executionPlan[index];
            if (row) row.time = "";
            renderAll();
        }

        function openTimeWheel(index) {
            const row = activityData.planSections.executionPlan[index];
            if (!row) return;
            let start = 840, end = 870; // 默认 14:00-14:30
            const parsed = parseTwRange(row.time);
            if (parsed) { start = parsed.start; end = parsed.end === parsed.start ? parsed.start + 30 : parsed.end; }
            twState = { index, start, end, mode: "start", lastMinInHalf: null };

            const overlay = document.createElement("div");
            overlay.className = "tw-overlay";
            overlay.innerHTML = `
            <div class="tw-popup">
                <div class="tw-title">🕐 时间轮盘 <span style="font-size:12px;color:var(--text-secondary);font-weight:400;">第 ${index + 1} 行 · ${esc((row.name || "").trim() ? row.name : "未命名环节")}</span></div>
                <p class="tw-sub">直接拖拽<span style="color:#059669;font-weight:600;">绿色（开始）</span>/<span style="color:#dc2626;font-weight:600;">红色（结束）</span>指针：靠近<span style="font-weight:600;">整十分</span>（:00/:10/:20…）自动吸附，<span style="font-weight:600;">单击落点</span>精确到 5 分钟；也可在上方<span style="font-weight:600;">✍ 手动填写</span>或<span style="font-weight:600;">点击表盘中心时间</span>直接输入（支持超过 24 小时，如 26:30），或 −1分/+1分 微调</p>
                <div class="tw-manual">
                    <span class="tw-manual-label">✍ 手动填写</span>
                    <div class="tw-manual-fields">
                        <label class="tw-manual-field">开始<input class="tw-manual-input" id="twInputStart" placeholder="14:00" maxlength="5" inputmode="numeric" autocomplete="off" spellcheck="false"
                               title="开始时间，支持超过 24 小时（如 26:30），回车或点击别处生效"
                               onchange="twManualTime('start', this.value)" onkeydown="if(event.key==='Enter')this.blur()"></label>
                        <label class="tw-manual-field">结束<input class="tw-manual-input" id="twInputEnd" placeholder="15:30" maxlength="5" inputmode="numeric" autocomplete="off" spellcheck="false"
                               title="结束时间，支持超过 24 小时（如 26:30），回车或点击别处生效"
                               onchange="twManualTime('end', this.value)" onkeydown="if(event.key==='Enter')this.blur()"></label>
                    </div>
                </div>
                <div class="tw-modes">
                    <button type="button" class="tw-mode-btn mode-start" id="twModeStart" onclick="twSetMode('start')">
                        <span class="tw-mode-label">● 开始时间</span><span class="tw-mode-val" id="twValStart"></span>
                    </button>
                    <button type="button" class="tw-mode-btn mode-end" id="twModeEnd" onclick="twSetMode('end')">
                        <span class="tw-mode-label">● 结束时间</span><span class="tw-mode-val" id="twValEnd"></span>
                    </button>
                </div>
                <div class="tw-duration" id="twDuration">⏱ 时长 --</div>
                <div class="tw-quick">
                    <button type="button" class="tw-quick-btn" onclick="twSetQuickDur(15)">15分钟</button>
                    <button type="button" class="tw-quick-btn" onclick="twSetQuickDur(30)">30分钟</button>
                    <button type="button" class="tw-quick-btn" onclick="twSetQuickDur(45)">45分钟</button>
                    <button type="button" class="tw-quick-btn" onclick="twSetQuickDur(60)">1小时</button>
                    <button type="button" class="tw-quick-btn" onclick="twSetQuickDur(90)">1.5小时</button>
                    <button type="button" class="tw-quick-btn" onclick="twSetQuickDur(120)">2小时</button>
                </div>
                <div class="tw-dial-wrap">
                    ${buildTwDialSvg()}
                    <div class="tw-dial-center">
                        <input class="tw-dial-time-input" id="twDialTime" value="--:--" placeholder="--:--" maxlength="5" inputmode="numeric" autocomplete="off" spellcheck="false"
                               title="点击输入时间，支持超过 24 小时（如 26:30），回车或点击别处生效"
                               onchange="twInputTime(this.value)" onkeydown="if(event.key==='Enter')this.blur()">
                        <div class="tw-nudge">
                            <button type="button" class="tw-nudge-btn" onclick="twNudge(-1)" title="减 1 分钟">−1分</button>
                            <span class="tw-day-chip" id="twDayChip" style="display:none;"></span>
                            <button type="button" class="tw-nudge-btn" onclick="twNudge(1)" title="加 1 分钟">+1分</button>
                        </div>
                        <div class="tw-dial-ampm">
                            <button type="button" class="tw-ampm-btn" id="twAm" onclick="twSetAmpm(0)">上午</button>
                            <button type="button" class="tw-ampm-btn" id="twPm" onclick="twSetAmpm(1)">下午</button>
                        </div>
                    </div>
                </div>
                <div class="tw-footer">
                    <button class="btn btn-outline btn-sm" onclick="twClearTime()">清除</button>
                    <button class="btn btn-outline btn-sm" onclick="twClose()">取消</button>
                    <button class="btn btn-primary btn-sm" onclick="twConfirm()">确定</button>
                </div>
            </div>`;
            overlay.addEventListener("mousedown", (e) => { if (e.target === overlay) twClose(); });
            document.body.appendChild(overlay);
            document.addEventListener("keydown", twOnKey);
            bindTwDial();
            renderTwDial();
        }

        function buildTwDialSvg() {
            const cx = 140, cy = 140;
            let ticks = "";
            for (let m = 0; m < 720; m += 5) {
                const ang = m * 0.5; // 12 点方向为 0°，5 分钟 = 2.5°
                const isHour = m % 60 === 0;
                const r1 = isHour ? 108 : 116, r2 = 126;
                const rad = (ang - 90) * Math.PI / 180;
                const x1 = cx + r1 * Math.cos(rad), y1 = cy + r1 * Math.sin(rad);
                const x2 = cx + r2 * Math.cos(rad), y2 = cy + r2 * Math.sin(rad);
                ticks += `<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" stroke="${isHour ? '#636e72' : '#d7dbe4'}" stroke-width="${isHour ? 2.4 : 1}" stroke-linecap="round"/>`;
            }
            let nums = "";
            for (let h = 0; h < 12; h++) {
                const rad = (h * 30 - 90) * Math.PI / 180;
                const x = cx + 86 * Math.cos(rad), y = cy + 86 * Math.sin(rad);
                nums += `<text x="${x.toFixed(2)}" y="${y.toFixed(2)}" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="${h % 3 === 0 ? 700 : 500}" fill="${h % 3 === 0 ? '#2d3436' : '#a0a6b0'}">${h === 0 ? 12 : h}</text>`;
            }
            return `
            <svg class="tw-dial" id="twDialSvg" viewBox="0 0 280 280">
                <circle cx="140" cy="140" r="138" fill="#f8f9fc" stroke="#e0e3eb" stroke-width="2"/>
                <circle cx="140" cy="140" r="127" fill="none" stroke="#eef0f5" stroke-width="1"/>
                ${ticks}
                ${nums}
                <path id="twDialArc" d="" fill="none" stroke="rgba(74,108,247,0.22)" stroke-width="14" stroke-linecap="round"/>
                <g id="twDialHandStart" transform="rotate(0 140 140)">
                    <line x1="140" y1="146" x2="140" y2="62" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
                    <line x1="140" y1="142" x2="140" y2="120" stroke="#10b981" stroke-width="9" stroke-linecap="round"/>
                </g>
                <g id="twDialHandEnd" transform="rotate(30 140 140)">
                    <line x1="140" y1="146" x2="140" y2="62" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
                    <line x1="140" y1="142" x2="140" y2="120" stroke="#ef4444" stroke-width="9" stroke-linecap="round"/>
                </g>
                <circle cx="140" cy="140" r="10" fill="#4a6cf7"/>
                <circle cx="140" cy="140" r="4" fill="#fff"/>
            </svg>`;
        }

        function bindTwDial() {
            const svg = document.getElementById("twDialSvg");
            if (!svg) return;
            let dragging = false;
            svg.addEventListener("pointerdown", (e) => {
                dragging = true;
                twState.lastMinInHalf = null;
                // 就近抓取：点击角度更接近哪根指针，就编辑哪根
                const rect = svg.getBoundingClientRect();
                const clickMin = twAngleToMin(e.clientX, e.clientY, rect);
                twState.mode = twCircDist(clickMin, twState.start % 720) <= twCircDist(clickMin, twState.end % 720)
                    ? "start" : "end";
                svg.setPointerCapture(e.pointerId);
                twApplyDrag(e);
            });
            svg.addEventListener("pointermove", (e) => { if (dragging) twApplyDrag(e); });
            ["pointerup", "pointercancel"].forEach(ev => svg.addEventListener(ev, () => { dragging = false; }));
        }

        function twApplyDrag(e) {
            const svg = document.getElementById("twDialSvg");
            const rect = svg.getBoundingClientRect();
            const minInHalf = twAngleToMinRaw(e.clientX, e.clientY, rect);
            const cur = twCur();
            let abs;
            if (twState.lastMinInHalf == null) {
                // 单击/首次落点：精确到 5 分钟刻度（保留非整数选项）
                abs = Math.floor(cur / 720) * 720 + (Math.round(minInHalf / 5) * 5) % 720;
                // 记录拖拽起点：后续按累计位移计算，慢速拖拽也跟手
                twState.dragStartRaw = minInHalf;
                twState.dragStartVal = abs;
            } else {
                // 拖拽：从落点累计总位移，跨 12 点时自动翻转上下午
                let delta = (minInHalf - twState.dragStartRaw + 720) % 720;
                if (delta > 360) delta -= 720;
                const absRaw = twState.dragStartVal + delta;
                // 磁性吸附：靠近整十分刻度（±2.5 分钟）吸到整十；其余按 5 分钟跟随
                const m = ((absRaw % 60) + 60) % 60;
                const tens = Math.round(m / 10) * 10;
                abs = Math.abs(m - tens) <= 2.5 ? absRaw + (tens - m) : Math.round(absRaw / 5) * 5;
            }
            twState.lastMinInHalf = minInHalf;
            twSetCur(Math.min(5999, Math.max(0, abs))); // 支持超过 24 小时（如 26:30）
            renderTwDial();
        }

        function twAngleToMin(x, y, rect) {
            const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
            let deg = Math.atan2(y - cy, x - cx) * 180 / Math.PI + 90; // 12 点方向为 0°
            deg = (deg + 360) % 360;
            return Math.round(deg / 360 * 720) % 720; // 吸附到 5 分钟
        }

        /** 未吸附的原始角度分钟（0-720，浮点），供拖拽磁性吸附使用 */
        function twAngleToMinRaw(x, y, rect) {
            const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
            let deg = Math.atan2(y - cy, x - cx) * 180 / Math.PI + 90;
            deg = (deg + 360) % 360;
            return deg / 360 * 720;
        }

        const twCur = () => twState.mode === "start" ? twState.start : twState.end;
        function twSetCur(v) { if (twState.mode === "start") twState.start = v; else twState.end = v; }

        function twSetMode(mode) {
            twState.mode = mode;
            twState.lastMinInHalf = null;
            renderTwDial();
        }

        /** 快捷时长：结束 = 开始 + 时长（封顶 23:55），并切到结束指针方便微调 */
        function twSetQuickDur(mins) {
            if (!twState) return;
            let end = twState.start + mins;
            if (end > 5999) {
                end = 5999;
                showToast("结束时间已设置到最晚 99:59");
            }
            twState.end = end;
            twState.mode = "end";
            twState.lastMinInHalf = null;
            renderTwDial();
        }

        function twSetAmpm(base) {
            const cur = twCur();
            if (Math.floor(cur / 720) % 2 === base) return;
            // 保留天数（支持超过 24 小时），只切换上午/下午
            twSetCur(Math.floor(cur / 1440) * 1440 + base * 720 + cur % 720);
            twState.lastMinInHalf = null;
            renderTwDial();
        }

        /** 微调当前指针 ±1 分钟，精确选到 5:46 这类任意分钟（支持超过 24 小时） */
        function twNudge(d) {
            if (!twState) return;
            twSetCur(Math.min(5999, Math.max(0, twCur() + d)));
            twState.lastMinInHalf = null;
            renderTwDial();
        }

        /** 解析手动输入 HH:MM（小时可为 26 这类超过 24 的值）；非法返回 null */
        function twParseInput(v) {
            const m = /^(\d{1,2})[:：](\d{1,2})$/.exec(String(v || "").trim());
            if (!m || +m[2] > 59) return null;
            return Math.min(5999, (+m[1]) * 60 + (+m[2]));
        }

        /** 表盘中心时间手动输入：作用于当前编辑指针（回车或失焦生效） */
        function twInputTime(v) {
            if (!twState) return;
            let val = twParseInput(v);
            if (val == null) { renderTwDial(); return; } // 非法输入：恢复当前时间
            if (twState.mode === "end") { while (val < twState.start) val += 1440; } // 跨天按次日计算
            twSetCur(val);
            twState.lastMinInHalf = null;
            renderTwDial();
        }

        /** ✍ 手动填写：直接填开始/结束时间，轮盘双指针同步跟随 */
        function twManualTime(which, v) {
            if (!twState) return;
            let val = twParseInput(v);
            if (val == null) { renderTwDial(); return; } // 非法输入：恢复原值
            if (which === "end") { while (val < twState.start) val += 1440; } // 跨天按次日计算
            if (which === "start") twState.start = val; else twState.end = val;
            twState.mode = which;
            twState.lastMinInHalf = null;
            renderTwDial();
        }

        function renderTwDial() {
            if (!twState) return;
            const cur = twCur();
            const base = Math.floor(cur / 720);
            // 双指针：绿=开始，红=结束，中间弧带显示区间
            const handStart = document.getElementById("twDialHandStart");
            if (handStart) handStart.setAttribute("transform", `rotate(${(twState.start % 720 * 0.5).toFixed(1)} 140 140)`);
            const handEnd = document.getElementById("twDialHandEnd");
            if (handEnd) handEnd.setAttribute("transform", `rotate(${(twState.end % 720 * 0.5).toFixed(1)} 140 140)`);
            const arc = document.getElementById("twDialArc");
            if (arc) arc.setAttribute("d", twState.end > twState.start ? twArcPath(twState.start, twState.end) : "");
            const t = document.getElementById("twDialTime");
            if (t && document.activeElement !== t) t.value = twFmt(cur);
            // ✍ 手动填写两个输入框与当前开始/结束同步（输入中不覆盖）
            const ms2 = document.getElementById("twInputStart");
            if (ms2 && document.activeElement !== ms2) ms2.value = twFmt(twState.start);
            const me2 = document.getElementById("twInputEnd");
            if (me2 && document.activeElement !== me2) me2.value = twFmt(twState.end);
            const am = document.getElementById("twAm"), pm = document.getElementById("twPm");
            const isPm = base % 2 === 1;
            if (am) am.classList.toggle("active", !isPm);
            if (pm) pm.classList.toggle("active", isPm);
            const dc = document.getElementById("twDayChip");
            if (dc) {
                const day = Math.floor(cur / 1440);
                dc.style.display = day >= 1 ? "" : "none";
                if (day >= 1) dc.textContent = `第${day + 1}天`;
            }
            const vs = document.getElementById("twValStart"), ve = document.getElementById("twValEnd");
            if (vs) vs.textContent = twFmt(twState.start);
            if (ve) ve.textContent = twFmt(twState.end);
            const ms = document.getElementById("twModeStart"), me = document.getElementById("twModeEnd");
            if (ms) ms.classList.toggle("active", twState.mode === "start");
            if (me) me.classList.toggle("active", twState.mode === "end");
            const dur = document.getElementById("twDuration");
            if (dur) {
                if (twState.end > twState.start) {
                    dur.textContent = `⏱ 时长 ${twDur(twState.end - twState.start)}`;
                    dur.classList.remove("warn");
                } else {
                    dur.textContent = "⚠️ 结束时间需晚于开始时间";
                    dur.classList.add("warn");
                }
            }
        }

        // ═══════════════════════════════════════════════
        function pickFloorPlanImgs(index) {
            const row = activityData.planSections.venueBookings[index];
            if (!row) return;
            const input = document.createElement("input");
            input.type = "file";
            input.accept = "image/*";
            input.multiple = true;
            input.onchange = () => {
                const files = Array.from(input.files || []);
                if (!files.length) return;
                Promise.all(files.map(f => resizeImageToDataUrl(f)))
                    .then(urls => {
                        if (!Array.isArray(row.floorPlanImgs)) row.floorPlanImgs = [];
                        row.floorPlanImgs.push(...urls);
                        renderAll();
                    })
                    .catch(() => showToast("图片读取失败，请重试"));
            };
            input.click();
        }

        function resizeImageToDataUrl(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const img = new Image();
                    img.onload = () => {
                        const MAX = 900;
                        let { width, height } = img;
                        if (width > MAX || height > MAX) {
                            const scale = MAX / Math.max(width, height);
                            width = Math.round(width * scale);
                            height = Math.round(height * scale);
                        }
                        const canvas = document.createElement("canvas");
                        canvas.width = width;
                        canvas.height = height;
                        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL("image/jpeg", 0.72));
                    };
                    img.onerror = reject;
                    img.src = reader.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

            const ai = activityData.aiAssistant;
            const hasLoading = Array.isArray(ai.messages) && ai.messages.some(m => m.loading);
            ai.isThinking = !!hasLoading;

            const messages = Array.isArray(ai.messages) ? ai.messages : [];
            const lastUserIndex = messages.map(m => m.role).lastIndexOf("user");
            const hasAssistantAfterLastUser = lastUserIndex >= 0 && messages.slice(lastUserIndex + 1).some(m => m.role === "assistant" && !m.loading);
            if (!ai.draftPlan && hasAssistantAfterLastUser) {
                const lastIdea = getLastUserIdea();
                ai.draftPlan = buildAiDraftPlan(lastIdea);
                ai.feasibilityReport = ai.feasibilityReport || buildAiFeasibilityReport(lastIdea);

        function getAiConversationRecords() {
            ensureAiAssistant();
            const messages = activityData.aiAssistant.messages || [];

            messages.forEach((message, index) => {
                if (message.role !== "user") return;
                const nextAssistant = messages.slice(index + 1).find(m => m.role === "assistant" && !m.loading);
                records.push({
                    messageIndex: index,
                    title: summarizeText(message.text, 28),
                    timeText: formatAiMessageTime(message.createdAt),
                    preview: nextAssistant ? summarizeText(nextAssistant.text, 52) : "AI 尚未完成回复，可点击恢复这条想法继续生成。"
                });
            });
            return records.reverse();
        }

            activityData.aiAssistant.ideaInput = message.text;
            activityData.aiAssistant.draftPlan = buildAiDraftPlan(message.text);

            ai.isThinking = true;
            ai.ideaInput = text;
            ai.messages.push({ role: "user", text, createdAt: new Date().toISOString() });

            const pendingIndex = ai.messages.push({
                role: "assistant",
                text: "已发送到本地代理，正在等待 DeepSeek 返回",
                loading: true,
                createdAt: new Date().toISOString()
            }) - 1;
            renderAiAssistant();
            saveActivityData();

            try {
                const result = await requestDeepSeekPlan(text);
                ai.draftPlan = normalizeAiDraftPlan(result.draftPlan || result.draft || {}, text);
                ai.feasibilityReport = normalizeAiFeasibilityReport(result.feasibilityReport || result.report || {}, text);
                ai.messages[pendingIndex] = {
                    role: "assistant",
                    text: result.reply || "DeepSeek 已生成拟策划案和可行性评估。你可以先检查右侧预览，再选择填入空白项或采纳到策划案。",
                    createdAt: new Date().toISOString()
                };
            } catch (error) {
                const draft = buildAiDraftPlan(text);
                ai.draftPlan = draft;
                ai.feasibilityReport = buildAiFeasibilityReport(text);
                ai.messages[pendingIndex] = {
                    role: "assistant",
                    text: `DeepSeek 暂时没有返回结果，已先用本地规则生成一版草稿。原因：${error.message}`,
                    createdAt: new Date().toISOString()
                };
            } finally {
                ai.isThinking = false;
            }

            saveActivityData();
            renderAiAssistant();
        }

        async function requestDeepSeekPlan(idea) {
            const selectedHistory = aiHistoryActivities.filter(h => activityData.aiAssistant.selectedHistoryIds.includes(h.id));
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 25000);
            const apiUrl = getDeepSeekApiUrl();
            const response = await fetch(apiUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                signal: controller.signal,
                body: JSON.stringify({
                    idea,
                    activityName: activityData.name,
                    currentPlan: activityData.planSections,
                    selectedHistory,
                    messages: activityData.aiAssistant.messages.slice(-8)
                })
            }).catch(error => {
                if (error.name === "AbortError") {
                    throw new Error(`本地代理请求超时。请求地址：${apiUrl}。请查看 PowerShell 是否打印了 DeepSeek 请求日志。`);
                }
                throw new Error(`无法连接本地代理。当前页面：${window.location.href}；请求地址：${apiUrl}；原始错误：${error.message}`);
            }).finally(() => {
                clearTimeout(timeout);
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) {
                throw new Error(payload.error || `本地代理返回 HTTP ${response.status}`);
            }
            return payload;
        }

        function getDeepSeekApiUrl() {
            if (window.location.protocol === "http:" || window.location.protocol === "https:") {
                return `${window.location.origin}/api/deepseek/plan`;
            }
            return "http://localhost:3000/api/deepseek/plan";
        }

        function normalizeAiDraftPlan(draft, idea) {
            const fallback = buildAiDraftPlan(idea);
            const generatedName = isCopiedUserPrompt(draft.name, idea) ? fallback.name : draft.name;
            const generatedTheme = isCopiedUserPrompt(draft.theme, idea) ? fallback.theme : draft.theme;
            const merged = {
                ...fallback,
                ...draft,
                name: generatedName || fallback.name,
                theme: generatedTheme || fallback.theme,
                targetAudience: draft.targetAudience || draft.audience || fallback.targetAudience
            };
            // 日期：优先新字段 dateTime，其次旧字段年月日拼接，最后回退
            const legacyDate = [draft.dateYear, draft.dateMonth, draft.dateDay].filter(Boolean).join("-");
            merged.dateTime = draft.dateTime || (legacyDate ? legacyDate + "（待确认具体时段）" : fallback.dateTime);
            // 人数：优先新字段 targetCount，其次旧字段 countPerSession × sessions
            const legacyCount = draft.countPerSession
                ? (Number(draft.countPerSession) || 0) * (Number(draft.sessions) || 1)
                : 0;
            merged.targetCount = draft.targetCount || (legacyCount ? String(legacyCount) : fallback.targetCount);
            // 结构化字段：新数组优先，否则从旧文本字段解析
            merged.executionPlan = getAiExecPlanRows(merged);
            merged.emergencyPlan = getAiEmergencyRows(merged);
            return merged;
        }

        function isCopiedUserPrompt(value, idea) {
            if (!value) return false;
            const cleanValue = String(value).replace(/\s+/g, "");
            const cleanIdea = String(idea || "").replace(/\s+/g, "");
            return cleanValue.length > 16 && cleanIdea.includes(cleanValue);
        }

        function normalizeAiFeasibilityReport(report, idea) {
            const fallback = buildAiFeasibilityReport(idea);
            return {
                score: report.score || fallback.score,
                level: report.level || fallback.level,
                criteria: Array.isArray(report.criteria) && report.criteria.length ? report.criteria : fallback.criteria,
                risks: Array.isArray(report.risks) && report.risks.length ? report.risks : fallback.risks,
                suggestions: Array.isArray(report.suggestions) && report.suggestions.length ? report.suggestions : fallback.suggestions
            };
        }

        // ── AI 草稿解析辅助：旧文本字段 → 新结构化字段 ──
        function parseExecPlanTable(md) {
            const rows = [];
            if (!md) return rows;
            const lines = String(md).split(/\r?\n/).map(l => l.trim()).filter(Boolean);
            for (const line of lines) {
                if (line.indexOf("|") < 0) continue;
                const cells = line.split("|").map(c => c.trim());
                const body = cells.slice(1, -1); // 去掉首尾空段
                if (!body.length) continue;
                if (body[0] === "时间节点" || /^-{2,}$/.test(body[0])) continue; // 表头 / 分隔行
                if (body.length >= 5) {
                    // 新表格格式：时间节点 / 环节名称 / 开展形式 / 核心环节说明
                    rows.push({ time: body[0], name: body[1], format: body[2], description: body[3] });
                    continue;
                }
                const time = body[0] || "";
                const name = body[1] || "";
                const rest = body.slice(2).filter(Boolean);
                const description = rest.map((c, i) => `${["负责人", "交付物"][i] || ""}：${c}`).join("；");
                if (time || name || description) rows.push({ time, name, format: "", description });
            }
            return rows;
        }

        function parseRiskPlanText(text) {
            const rows = [];
            if (!text) return rows;
            const lines = String(text).split(/\r?\n/).map(l => l.trim()).filter(Boolean);
            for (const line of lines) {
                const cleaned = line.replace(/^\d+[.、]\s*/, "").replace(/^[-•*]\s*/, "").replace(/^【.+?】\s*/, "");
                const idx = cleaned.indexOf("：");
                if (idx < 0) continue;
                rows.push({ risk: cleaned.slice(0, idx).trim(), response: cleaned.slice(idx + 1).trim(), person: "" });
            }
            return rows;
        }

        function getAiExecPlanRows(draft) {
            if (!draft) return [];
            if (Array.isArray(draft.executionPlan) && draft.executionPlan.length) return draft.executionPlan;
            if (draft.execution) {
                const parsed = parseExecPlanTable(draft.execution);
                if (parsed.length) return parsed;
            }
            if (draft.contentFlow) return [{ time: "", name: "", format: "", description: draft.contentFlow }];
            return [];
        }

        function getAiEmergencyRows(draft) {
            if (!draft) return [];
            if (Array.isArray(draft.emergencyPlan) && draft.emergencyPlan.length) return draft.emergencyPlan;
            if (draft.riskPlan) {
                const parsed = parseRiskPlanText(draft.riskPlan);
                if (parsed.length) return parsed;
            }
            return [];
        }

        function buildAiDraftPlan(idea) {
            const analysis = analyzeActivityIdea(idea);
            const selected = aiHistoryActivities.filter(h => activityData.aiAssistant.selectedHistoryIds.includes(h.id));
            const historyLine = selected.length
                ? `参考历史活动经验：${selected.map(h => h.title).join("、")}。`
                : "暂无指定历史活动参考，先按通用社团活动经验生成。";
            const currentName = activityData.name.trim();
            const name = currentName || analysis.name;
            const theme = analysis.theme;
            const safeTime = analysis.recommendedTime || "周末下午或傍晚";
            const coreValue = analysis.valueStatement;
            const execPlanText = buildExecutionPlan(analysis, safeTime);
            const riskPlanText = buildRiskPlan(analysis);
            return {
                name,
                theme,
                objective: analysis.objective,
                dateTime: activityData.planSections.dateTime || safeTime,
                location: activityData.planSections.location || "",
                targetAudience: analysis.targetAudience,
                targetCount: activityData.planSections.targetCount || analysis.defaultCount,
                purpose: `${coreValue}\n${historyLine}\n本活动的意义在于把社团成员的兴趣、表达和协作转化为一次可参与、可复盘、可延展的活动体验，而不是简单复述用户提出的原始问题。`,
                contentFlow: buildContentFlow(analysis),
                requirements: buildRequirements(analysis, safeTime),
                execution: execPlanText,
                riskPlan: riskPlanText,
                executionPlan: parseExecPlanTable(execPlanText),
                emergencyPlan: parseRiskPlanText(riskPlanText)
            };
        }

        function buildAiFeasibilityReport(idea) {
            const analysis = analyzeActivityIdea(idea);
            const criteria = scoreFeasibility(analysis);
            const total = criteria.reduce((sum, item) => sum + item.score, 0);
            const level = total >= 85 ? "较低" : total >= 72 ? "中等" : total >= 58 ? "中等偏高" : "较高";
            return {
                score: `${total}/100`,
                level,
                criteria,
                risks: analysis.risks,
                suggestions: analysis.suggestions
            };
        }

        function analyzeActivityIdea(idea) {
            const text = (idea || "").trim();
            const isCoffee = /咖啡|手冲|拿铁|美式|咖啡馆|咖啡厅/.test(text);
            const isAlcohol = /酒|调酒|鸡尾酒|啤酒|红酒|微醺/.test(text);
            const isStory = /故事|交换|分享|叙事/.test(text);
            const isLateNight = /晚上|夜晚|深夜|夜间|通宵|凌晨|晚间/.test(text);
            const isFoodDrink = isCoffee || isAlcohol || /饮品|甜品|茶|烘焙/.test(text);
            const isCompetition = /比赛|竞赛|马拉松|挑战/.test(text);
            const isLarge = /大型|全校|上百|千人|音乐节|晚会/.test(text);
            const isCampus = /学校|校园|社团|同学|学生/.test(text);
            const rawTheme = extractThemeFromIdea(text);
            const naming = createActivityNaming(text, { isCoffee, isAlcohol, isStory, isLateNight, isFoodDrink, isCompetition, isLarge, isCampus, rawTheme });
            const name = naming.name;
            const theme = naming.theme;
            const risks = [];
            const suggestions = [];

            if (isLateNight && isFoodDrink) {
                risks.push("夜间饮品类活动容易涉及返程安全、场地开放时间、噪音管理和身体负担，不建议默认安排在晚上。");
                suggestions.push("建议改为周五下午、周末下午或傍晚早段，并设置无咖啡因/低糖饮品选项。");
            }
            if (isAlcohol) {
                risks.push("含酒精活动在校园社团场景下存在审批、安全、年龄合规和舆情风险，不能按普通社交活动处理。");
                suggestions.push("建议改为无酒精 mocktail、饮品文化分享或故事茶话会，避开酒精供应。");
            }
            if (isLarge) {
                risks.push("活动规模较大，对场地容量、安保、志愿者和应急预案要求明显提高。");
                suggestions.push("先做 30-50 人试点版，再根据反馈扩大规模。");
            }
            if (!/时间|地点|人数|对象|预算|场地/.test(text)) {
                risks.push("原始需求缺少时间、地点、人数或对象信息，落地前需要补齐基础条件。");
                suggestions.push("先确认预计人数、目标对象、场地类型和活动时长。");
            }

            if (!risks.length) {
                risks.push("需要进一步确认场地、人数和组织分工，避免方案停留在创意层面。");
            }
            if (!suggestions.length) {
                suggestions.push("建议先做一个低成本试点版本，用签到、反馈表和复盘文档沉淀经验。");
            }
            suggestions.push("预算部分本阶段只提示风险，等预算案模块成型后再拆分金额。");

            const recommendedTime = isLateNight && isFoodDrink ? "周五下午 15:00-17:00 或周末下午 14:00-16:00" : "周末下午或傍晚早段";
            const targetAudience = isCampus ? "本校社团成员及对主题感兴趣的同学" : inferAudience(text);
            const defaultCount = isLarge ? "50" : isCompetition ? "40" : "30";
            const objective = isStory
                ? "通过故事分享和轻量互动增强成员连接，营造安全、开放、有记忆点的社团交流场景。"
                : `围绕“${theme}”提升成员参与度，形成一次目标清晰、流程可控、便于复盘的社团活动。`;
            const valueStatement = isStory
                ? "活动以故事交换为核心，价值不在于单纯消费饮品，而在于让参与者通过主题叙事建立连接、表达个人经验，并增强社团内部认同感。"
                : `活动围绕“${theme}”展开，价值在于将成员兴趣转化为具体参与体验，并为社团后续活动沉淀组织方法。`;

            return {
                text,
                name,
                theme,
                rawTheme,
                isCoffee,
                isAlcohol,
                isStory,
                isLateNight,
                isFoodDrink,
                isCompetition,
                isLarge,
                isCampus,
                recommendedTime,
                targetAudience,
                defaultCount,
                objective,
                valueStatement,
                risks,
                suggestions
            };
        }

        function buildContentFlow(analysis) {
            if (analysis.isStory && (analysis.isCoffee || analysis.isFoodDrink)) {
                return "1. 签到与分组：按 4-6 人小组安排座位，发放故事提示卡。\n2. 破冰引导：主持人说明“故事交换”规则，强调尊重、保密和自愿分享。\n3. 饮品体验：提供无酒精、低咖啡因或常规咖啡选项，避免把活动变成单纯消费。\n4. 故事交换：围绕“第一次尝试”“一次转折”“最近的小确幸”等主题轮流分享。\n5. 共创环节：每组提炼一个共同关键词，制作便签墙或故事地图。\n6. 收尾反馈：填写反馈表，邀请参与者写下下一次想听/想讲的主题。";
            }
            return "1. 签到与破冰：确认参与者信息，建立基本互动氛围。\n2. 主题导入：由负责人说明活动背景、目标和参与方式。\n3. 核心环节：围绕主题进行分享、体验、共创或分组任务。\n4. 互动反馈：设置提问、展示或投票环节，增强参与感。\n5. 收尾总结：回顾活动成果，收集反馈，并说明后续社群承接方式。";
        }

        function buildRequirements(analysis, safeTime) {
            const base = [`建议时间：${safeTime}。`, "场地需安静、便于围坐交流，最好支持投影、音响和基础照明。", "需提前准备签到表、主持稿、流程表、反馈表和宣传文案。"];
            if (analysis.isFoodDrink) base.push("饮品需明确成分和过敏提示，准备低糖、无咖啡因或温水等替代选项。");
            if (analysis.isAlcohol) base.push("不建议供应酒精饮品；如保留“微醺/调酒”概念，应改为无酒精 mocktail 或饮品文化体验。");
            base.push("预算部分暂不生成明细，后续重点核算场地、饮品物料、宣传和应急费用。");
            return base.join("\n");
        }

        function buildExecutionPlan(analysis, safeTime) {
            return `| 时间节点 | 任务 | 负责人 | 交付物 |\n|---------|------|--------|--------|\n| T-10 天 | 明确主题、对象、人数上限和活动时间（建议 ${safeTime}） | 策划负责人 | 活动初稿 |\n| T-7 天 | 确认场地、主持人和物资清单 | 执行负责人 | 场地确认/物资表 |\n| T-5 天 | 发布宣传与报名通道，说明活动规则和注意事项 | 宣传负责人 | 推文/海报/报名表 |\n| T-2 天 | 检查饮品/道具/设备并完成流程彩排 | 全体执行组 | 彩排记录 |\n| 活动当天 | 控制节奏、维护秩序、收集反馈 | 全体执行组 | 签到表/反馈表 |\n| T+3 天 | 完成复盘与资料归档 | 策划负责人 | 复盘文档 |`;
        }

        function buildRiskPlan(analysis) {
            const items = [
                "报名人数不足：提前设置二次宣传节点，并准备社群定向邀请。",
                "现场冷场：准备故事提示卡、主持追问话术和小组讨论机制。",
                "场地或设备异常：提前一天测试设备，并准备备用场地或无投影版本流程。",
                "参与者反馈不足：活动结束前现场填写反馈表，避免事后回收率过低。"
            ];
            if (analysis.isLateNight && analysis.isFoodDrink) items.unshift("时间风险：不建议安排在深夜或过晚时段，应改为下午或傍晚早段，降低返程和身体负担风险。");
            if (analysis.isAlcohol) items.unshift("合规风险：校园社团活动不建议供应酒精，需改为无酒精饮品体验并在宣传中明确说明。");
            return items.map((item, i) => `${i + 1}. ${item}`).join("\n");
        }

        function scoreFeasibility(analysis) {
            const criteria = [
                { name: "目标清晰度", score: /故事|分享|交流|咖啡|活动|策划|比赛|讲座/.test(analysis.text) ? 17 : 12, reason: "活动主题可识别，但仍需明确参与对象和成果形式。" },
                { name: "安全与合规", score: 18, reason: "未发现明显高危要素。" },
                { name: "资源复杂度", score: analysis.isLarge ? 10 : analysis.isFoodDrink ? 15 : 17, reason: analysis.isFoodDrink ? "饮品和场地准备增加一定物资管理复杂度。" : "资源需求相对常规。" },
                { name: "时间合理性", score: 17, reason: "时间可通过排期优化。" },
                { name: "参与体验", score: analysis.isStory ? 18 : 15, reason: analysis.isStory ? "故事交换有明确互动机制，参与感较强。" : "需要进一步设计互动机制。" }
            ];
            if (analysis.isLateNight && analysis.isFoodDrink) {
                criteria[1].score -= 6;
                criteria[1].reason = "夜间饮品活动涉及返程、安全和身体负担，不宜直接通过。";
                criteria[3].score -= 7;
                criteria[3].reason = "原设想若放在晚上，时间合理性较弱，建议调整到下午或傍晚早段。";
            }
            if (analysis.isAlcohol) {
                criteria[1].score -= 8;
                criteria[1].reason = "含酒精设定在校园社团场景下合规风险较高。";
            }
            if (!/时间|地点|人数|对象|预算|场地/.test(analysis.text)) {
                criteria[0].score -= 3;
                criteria[2].score -= 2;
            }
            return criteria.map(c => ({ ...c, score: Math.max(0, Math.min(20, c.score)) }));
        }

        function extractThemeFromIdea(idea) {
            const named = idea.match(/([A-Za-z0-9\u4e00-\u9fa5 ]{2,24}(分享会|工作坊|沙龙|讲座|比赛|竞赛|展览|晚会|活动))/);
            if (named) {
                let cleaned = named[1].trim();
                for (let i = 0; i < 3; i++) {
                    cleaned = cleaned
                        .replace(/^(我想|想要|想办|办|举办|做|组织|策划|设计)?一?场?/, "")
                        .replace(/^在(晚上|夜晚|下午|上午|周末|学校|校园|校内|社团|[^的]{1,12})的?/, "")
                        .replace(/^.+?社团(策划|设计|举办|组织)?一?场?/, "")
                        .replace(/^面向.+?的\s*/, "")
                        .trim();
                }
                if (cleaned) return cleaned;
            }
            const short = idea.replace(/[，。,.！!？?]/g, " ").trim().split(/\s+/)[0] || "新活动策划";
            return short.length > 18 ? short.slice(0, 18) + "活动" : short;
        }

        function createActivityNaming(text, flags) {
            const concept = flags.rawTheme || "社团共创活动";
            if (flags.isStory && flags.isAlcohol) {
                return {
                    name: "杯中故事会",
                    theme: "以无酒精饮品为媒介的校园故事交换与社群连接活动"
                };
            }
            if (flags.isStory && flags.isCoffee) {
                return {
                    name: "啡页故事会",
                    theme: "以咖啡香气连接个人经历的校园故事分享活动"
                };
            }
            if (flags.isCoffee) {
                return {
                    name: "咖啡慢谈局",
                    theme: "围绕咖啡体验与轻社交展开的社团交流活动"
                };
            }
            if (/AI|人工智能|工具/.test(text) && /分享|交流|讲/.test(text)) {
                return {
                    name: "AI工具实验室",
                    theme: "面向社团成员的 AI 工具体验、分享与实践活动"
                };
            }
            if (flags.isCompetition) {
                return {
                    name: `${trimActivitySuffix(concept)}挑战赛`,
                    theme: `围绕${trimActivitySuffix(concept)}展开的团队协作与成果展示活动`
                };
            }
            if (flags.isStory) {
                return {
                    name: "故事交换所",
                    theme: "以个人叙事和小组交流促进成员连接的社团活动"
                };
            }
            const clean = trimActivitySuffix(concept);
            return {
                name: clean.length > 10 ? `${clean.slice(0, 10)}计划` : `${clean}计划`,
                theme: `围绕${clean}展开的社团参与体验与共创活动`
            };
        }

        function trimActivitySuffix(value) {
            return String(value || "社团共创")
                .replace(/^(我想|想要|想办|想做|办|做|举办|组织|策划|设计)?一?个?场?/, "")
                .replace(/活动$/, "")
                .replace(/分享会$/, "分享")
                .replace(/工作坊$/, "工作坊")
                .trim() || "社团共创";
        }

        function inferAudience(idea) {
            if (/新生|新成员|招新/.test(idea)) return "社团新成员及对主题感兴趣的潜在成员";
            if (/老师|嘉宾|行业|企业/.test(idea)) return "社团成员、相关专业同学及外部嘉宾";
            if (/亲子|社区/.test(idea)) return "社区居民及亲子家庭";
            return "社团成员及对活动主题感兴趣的同学";
        }

        function applyAiDraftToPlan(mode) {
            ensureAiAssistant();
            const draft = activityData.aiAssistant.draftPlan;
            if (!draft) {
                showToast("请先和 AI 策划助手对话生成拟策划案。");
                return;
            }
            const p = activityData.planSections;
            const write = (key, value) => {
                const trimmed = value ? String(value).trim() : "";
                if (!trimmed) return;
                if (mode === "overwrite" || !p[key] || !String(p[key]).trim()) p[key] = trimmed;
            };

            if (mode === "overwrite" || !activityData.name.trim()) activityData.name = draft.name;
            write("theme", draft.theme);
            write("objective", draft.objective);
            write("dateTime", draft.dateTime);
            write("location", draft.location);
            write("targetAudience", draft.targetAudience);
            write("targetCount", draft.targetCount);

            // 结构化表格：AI 行数组 → 填入；空白表格时才写（非覆盖模式）
            const execRows = getAiExecPlanRows(draft).filter(r => (r.time || "").trim() || (r.name || "").trim() || (r.description || "").trim());
            if (execRows.length) {
                if (mode === "overwrite" || !(p.executionPlan || []).some(r => (r.time || "").trim() || (r.name || "").trim())) {
                    p.executionPlan = execRows;
                }
            }
            const emRows = getAiEmergencyRows(draft).filter(r => (r.response || "").trim());
            if (emRows.length) {
                if (mode === "overwrite" || !(p.emergencyPlan || []).some(r => (r.response || "").trim())) {
                    p.emergencyPlan = emRows;
                }
            }

            activityData.planContent = [draft.objective, draft.targetAudience ? `面向对象：${draft.targetAudience}` : "", draft.dateTime ? `活动时间：${draft.dateTime}` : ""].filter(Boolean).join("\n");

            saveActivityData();
            renderAll();
            showToast(mode === "overwrite" ? "AI 拟策划案已采纳并覆盖当前策划案。" : "AI 拟策划案已填入空白字段。");
        }

        function scrollAiMessages() {
            setTimeout(() => {
                ["aiMiniMessages", "aiFullMessages"].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.scrollTop = el.scrollHeight;
                });
            }, 0);
        }

        // ── 旧版本数据迁移：六部分 planOverview → 新十个部分结构 ──
        function migrateLegacyPlanSections(p) {
            if (!p) return;
            const legacy = p.planOverview;
            if (!legacy || p.theme) return; // 无旧数据或已是新结构
            p.theme = p.theme || legacy.theme || "";
            p.objective = p.objective || legacy.objective || "";
            if (legacy.dateYear || legacy.dateMonth || legacy.dateDay) {
                p.dateTime = p.dateTime || [legacy.dateYear, legacy.dateMonth, legacy.dateDay].filter(Boolean).join("-");
            }
            p.targetAudience = p.targetAudience || legacy.targetAudience || "";
            const legacyCount = legacy.countPerSession
                ? (Number(legacy.countPerSession) || 0) * (Number(legacy.sessions) || 1)
                : 0;
            p.targetCount = p.targetCount || (legacyCount ? String(legacyCount) : legacy.countPerSession) || "";
            if (!p.executionPlan || !p.executionPlan.length) {
                p.executionPlan = [{ time: "", name: "", format: "", description: p.execution || "" }];
            }
            if (!p.emergencyPlan || !p.emergencyPlan.length) {
                p.emergencyPlan = parseRiskPlanText(p.riskPlan);
            }
        }

        // ── 旧版本预算行 {item, cost} → 新行结构 ──
        function migrateLegacyBudget(budget) {
            if (!Array.isArray(budget)) return [];
            return budget.map(b => {
                if (b && typeof b === "object" && "name" in b) return b;
                const item = (b && (b.item || b.name)) || "";
                const cost = b ? String(b.cost || b.amount || "") : "";
                return { name: item, unitPrice: cost, unit: "", quantity: "1", reusable: "否", purpose: "", purchaseLink: "" };
            });
        }

        // ── Init: Load saved activity data ──
        function init() {
            // 异步加载资料库活动档案作为 AI 助手「参考活动」（失败静默降级）
            loadArchiveActivities();

            const params = new URLSearchParams(window.location.search);
            const id = params.get("id");
            if (id) {
                // 按活动 id 读取各自独立的草稿数据
                const saved = localStorage.getItem("editActivity:" + id);
                if (saved) {
                    try {
                        const data = JSON.parse(saved);
                        // Map saved fields to activityData
                        if (data.title) activityData.name = data.title;
                        if (data.desc) activityData.planContent = data.desc;
                        if (data.type !== undefined) activityData.type = data.type;
                        if (data.status) {
                            // Pre-complete steps based on status
                            if (data.status === "progress") {
                                for (let i = 0; i <= 4; i++) completedSteps.add(i); // steps 1-5
                            } else if (data.status === "open") {
                                for (let i = 0; i <= 3; i++) completedSteps.add(i); // steps 1-4
                            } else if (data.status === "draft") {
                                completedSteps.add(0); // step 1 only
                            }
                        }
                        // Load any previously saved workflow data
                        if (data.aiPlan) activityData.aiPlan = data.aiPlan;
                        if (data.planContent) activityData.planContent = data.planContent;
                        if (data.planSections) {
                            activityData.planSections = data.planSections;
                            migrateLegacyPlanSections(activityData.planSections);
                        }
                        if (data.budget) activityData.budget = migrateLegacyBudget(data.budget);
                        if (data.checklist) activityData.checklist = data.checklist;
                        if (data.purchaseList) activityData.purchaseList = data.purchaseList;
                        if (data.organizationName !== undefined) activityData.organizationName = data.organizationName;
                        if (data.activityLeader !== undefined) activityData.activityLeader = data.activityLeader;
                        if (data.financePerson !== undefined) activityData.financePerson = data.financePerson;
                        if (data.approvalDate !== undefined) activityData.approvalDate = data.approvalDate;
                        if (data.approvalOpinion !== undefined) activityData.approvalOpinion = data.approvalOpinion;
                        if (data.approvalActivityLeader !== undefined) activityData.approvalActivityLeader = data.approvalActivityLeader;
                        if (data.approved !== undefined) activityData.approved = data.approved;
                        if (data.uploads) activityData.uploads = data.uploads;
                        if (data.reflection) activityData.reflection = data.reflection;
                        if (data.rating) activityData.rating = data.rating;
                        if (data.aiAssistant) {
                            activityData.aiAssistant = {
                                ...activityData.aiAssistant,
                                ...data.aiAssistant,
                                isThinking: false,
                                miniOpen: false,
                                fullscreenOpen: false
                            };
                        }
                        if (data.completedSteps) {
                            data.completedSteps.forEach(i => completedSteps.add(i));
                        }
                    } catch (e) { /* ignore parse errors */ }
                }
                const aiHistory = loadAiAssistantHistory(id);
                if (aiHistory) {
                    activityData.aiAssistant = {
                        ...activityData.aiAssistant,
                        ...aiHistory
                    };
                }
            }
        }

        init();
        renderAll();

        // ── 未完成定位：用户开始填写后自动清除该处高亮，并同步悬浮按钮计数 ──
        ["input", "change"].forEach(evt =>
            document.getElementById("mainContent").addEventListener(evt, (e) => {
                const t = e.target;
                if (t && t.classList && t.classList.contains("field-missing")) t.classList.remove("field-missing");
                const nav = document.getElementById("missingNav");
                if (nav && nav.style.display !== "none" && missingCursor.step >= 0) {
                    const missing = getMissingFields(missingCursor.step);
                    if (!missing.length) {
                        hideMissingNav();
                    } else {
                        const current = missing.find(m => m.key === missingCursor.lastKey) || missing[0];
                        missingCursor.lastKey = current.key;
                        updateMissingNav(missing, current);
                    }
                }
            })
        );

        // 嵌入模式（资料库侧栏「AI 活动策划助手」入口）：直接打开 AI 助手主界面
        if (new URLSearchParams(window.location.search).get("embed") === "archive-planner") {
            openAiFullscreen();
        }
    </script>
</body>
</html>
