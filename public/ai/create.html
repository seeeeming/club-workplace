                if (!res.ok) {
                    mergeAiHistoryActivities(localActivities);
                    return;
                }
                const list = await res.json();
                const archiveActivities = Array.isArray(list) ? list.map(normalizeArchiveActivity) : [];
                mergeAiHistoryActivities([...archiveActivities, ...localActivities]);
                // 若 AI 全屏面板已打开（展示「参考活动」），刷新它
                if (activityData.aiAssistant && activityData.aiAssistant.fullscreenOpen) {
                    renderAll();
                }
            } catch (e) {
                // 资料库后端未启动，保留内置示例，并补充本地 Reflection 历史
                mergeAiHistoryActivities(localActivities);
                if (activityData.aiAssistant && activityData.aiAssistant.fullscreenOpen) {
                    renderAll();
                }
            }
        }

        function normalizeArchiveActivity(a) {
            const materials = Array.isArray(a.materials) ? a.materials : [];
            const materialText = materials
                .map(m => [m.optimized_name || m.name, m.file_type, m.key_info || m.summary].filter(Boolean).join("："))
                .filter(Boolean)
                .join("\n");
            return {
                id: `archive-${String(a.id)}`,
                sourceId: String(a.id),
                title: a.name || a.title || "未命名活动",
                tags: Array.isArray(a.activity_types) ? a.activity_types : Array.isArray(a.tags) ? a.tags : [],
                summary: a.ai_summary || a.summary || materialText || "",
                plan: firstNonEmpty(a.plan, a.plan_content, a.planSections, a.planning, a.proposal, a.scheme, pickMaterialByType(materials, /策划|方案|plan/i)),
                budget: firstNonEmpty(a.budget, a.budget_plan, a.budgetPlan, a.budget_items, pickMaterialByType(materials, /预算|budget/i)),
                photos: firstNonEmpty(a.photos, a.photo, a.images, a.site_photos, materials.filter(m => /照片|图片|现场|image|photo/i.test(`${m.file_type || ""} ${m.optimized_name || ""}`))),
                reflection: firstNonEmpty(a.reflection, a.reflection_summary, a.review, a.review_summary, a.replay, pickMaterialByType(materials, /复盘|总结|reflection|review/i)),
                archive: materials
            };
        }

        function readLocalReflectionActivities() {
            try {
                const raw = localStorage.getItem("club-reflection-store-v1");
                if (!raw) return [];
                const data = JSON.parse(raw);
                const activities = Array.isArray(data.activities) ? data.activities : [];
                const reflections = Array.isArray(data.reflections) ? data.reflections : [];
                const knowledge = Array.isArray(data.knowledge) ? data.knowledge : [];
                return activities.map(a => {
                    const reflection = reflections.find(r => r.activityId === a.id);
                    const qas = Array.isArray(reflection && reflection.qas) ? reflection.qas : [];
                    const relatedKnowledge = reflection
                        ? knowledge.filter(k => Array.isArray(reflection.knowledgeIds) && reflection.knowledgeIds.includes(k.id))
                        : [];
                    return {
                        id: `reflection-${String(a.id)}`,
                        sourceId: String(a.id),
                        title: a.title || "未命名活动",
                        tags: ["Reflection", a.reflected ? "已复盘" : "未复盘"],
                        summary: a.reflected ? "来自本地 Reflection 的活动记录与复盘沉淀。" : "来自本地已完成活动记录，尚未完成复盘。",
                        plan: "",
                        budget: "",
                        photos: a.photo ? [a.photo] : [],
                        reflection: qas.map(qa => `${qa.question}：${qa.answer}`).join("\n"),
                        archive: relatedKnowledge.map(k => `${k.type === "risk" ? "风险" : "经验"}：${k.content}`)
                    };
                });
            } catch (e) {
                return [];
            }
        }

        function mergeAiHistoryActivities(incoming) {
            if (!Array.isArray(incoming) || !incoming.length) return;
            const merged = [...incoming, ...aiHistoryActivities];
            const seen = new Set();
            aiHistoryActivities = merged.filter(item => {
                if (!item || !item.id || seen.has(item.id)) return false;
                seen.add(item.id);
                return true;
            });
        }

        function firstNonEmpty(...values) {
            return values.find(value => {
                if (Array.isArray(value)) return value.length > 0;
                if (value && typeof value === "object") return Object.keys(value).length > 0;
                return String(value || "").trim();
            }) || "";
        }

        function pickMaterialByType(materials, pattern) {
            const matched = (materials || []).filter(m => pattern.test(`${m.file_type || ""} ${m.optimized_name || ""} ${m.name || ""}`));
            return matched.map(m => [m.optimized_name || m.name, m.key_info || m.summary || m.content].filter(Boolean).join("：")).filter(Boolean).join("\n");
        }

        function ensureAiAssistant() {
            if (aiAssistantEnsuring) return;
            aiAssistantEnsuring = true;
            if (!activityData.aiAssistant) {
                activityData.aiAssistant = {};
            }
            try {
                activityData.aiAssistant = normalizeAiAssistantState({
                    floatVisible: true,
                    miniOpen: false,
                    fullscreenOpen: false,
                    ideaInput: "",
                    selectedHistoryIds: [],
                    conversationHistoryOpen: false,
                    messages: [
                        {
                            role: "assistant",
                            text: "你好，我是 AI 策划助手。你可以先用一句话告诉我活动想法，我会帮你追问、评估可行性，并生成可采纳到策划案的草稿。"
                        }
                    ],
                    feasibilityReport: null,
                    draftPlan: null,
                    isThinking: false,
                    activeRequestId: null,
                    currentThreadStartIndex: 0,
                    sessions: [],
                    currentSessionId: "",
                    ...activityData.aiAssistant
                });
                migrateAiSessions();
            } finally {
                aiAssistantEnsuring = false;
            }
        }

        function normalizeAiAssistantState(ai) {
            const keepLoading = !!ai.activeRequestId;
            const normalized = {
                ...ai,
                selectedHistoryIds: Array.isArray(ai.selectedHistoryIds) ? ai.selectedHistoryIds : [],
                conversationHistoryOpen: !!ai.conversationHistoryOpen,
                messages: Array.isArray(ai.messages) ? ai.messages.filter(Boolean).filter(m => keepLoading || !m.loading) : [],
                sessions: Array.isArray(ai.sessions) ? ai.sessions.filter(Boolean) : [],
                activeRequestId: ai.activeRequestId || null
            };
            normalized.sessions = normalized.sessions.slice(-30).map(session => ({
                id: session.id || `ai-session-${Date.now()}-${Math.random().toString(16).slice(2)}`,
                title: session.title || "历史对话",
                createdAt: session.createdAt || new Date().toISOString(),
                updatedAt: session.updatedAt || session.createdAt || new Date().toISOString(),
                messages: (Array.isArray(session.messages) ? session.messages : []).filter(Boolean).filter(m => keepLoading || !m.loading).slice(-80),
                draftPlan: session.draftPlan || null,
                feasibilityReport: session.feasibilityReport || null
            }));
            normalized.isThinking = keepLoading && normalized.sessions.some(session => session.messages.some(m => m.loading));
            return normalized;
        }

        function createAiSession(title = "新对话") {
            return {
                id: `ai-session-${Date.now()}-${Math.random().toString(16).slice(2)}`,
                title,
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString(),
                messages: [
                    {
                        role: "assistant",
                        text: title === "新对话"
                            ? "已开启新对话。你可以重新描述活动想法；需要生成策划案时，可以直接说“生成策划案”或“为某社团策划一场活动”。"
                            : "你好，我是 AI 策划助手。你可以先用一句话告诉我活动想法，我会帮你追问、评估可行性，并生成可采纳到策划案的草稿。",
                        createdAt: new Date().toISOString()
                    }
                ],
                draftPlan: null,
                feasibilityReport: null
            };
        }

        function migrateAiSessions() {
            const ai = activityData.aiAssistant;
            if (!Array.isArray(ai.sessions)) ai.sessions = [];
            if (!ai.sessions.length) {
                ai.sessions.push({
                    id: `ai-session-${Date.now()}-legacy`,
                    title: "历史对话",
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString(),
                    messages: Array.isArray(ai.messages) && ai.messages.length ? ai.messages.filter(m => !m.loading) : createAiSession("历史对话").messages,
                    draftPlan: ai.draftPlan || null,
                    feasibilityReport: ai.feasibilityReport || null
                });
            }
            if (!ai.currentSessionId || !ai.sessions.some(s => s.id === ai.currentSessionId)) {
                ai.currentSessionId = ai.sessions[ai.sessions.length - 1].id;
            }
            refreshAiConversationTitles();
            const current = ai.sessions.find(s => s.id === ai.currentSessionId);
            if ((!Array.isArray(ai.messages) || !ai.messages.length) && current) {
                syncAiSessionToLegacy();
            }
        }

        function getCurrentAiSession() {
            const ai = activityData.aiAssistant;
            if (!Array.isArray(ai.sessions)) ai.sessions = [];
            if (!ai.sessions.length) {
                const session = createAiSession("新对话");
                ai.sessions.push(session);
                ai.currentSessionId = session.id;
            }
            return ai.sessions.find(s => s.id === ai.currentSessionId) || ai.sessions[ai.sessions.length - 1];
        }

        function getCurrentAiMessages() {
            const session = getCurrentAiSession();
            if (!session) return [];
            if (!Array.isArray(session.messages)) session.messages = [];
            return session.messages;
        }

        function syncAiSessionToLegacy() {
            const ai = activityData.aiAssistant;
            const session = ai.sessions.find(s => s.id === ai.currentSessionId);
            if (!session) return;
            ai.messages = session.messages || [];
            ai.draftPlan = session.draftPlan || null;
            ai.feasibilityReport = session.feasibilityReport || null;
            ai.currentThreadStartIndex = 0;
        }

        function syncLegacyToAiSession() {
            const ai = activityData.aiAssistant;
            const session = ai.sessions.find(s => s.id === ai.currentSessionId);
            if (!session) return;
            const currentMessages = Array.isArray(session.messages) ? session.messages : [];
            const legacyMessages = Array.isArray(ai.messages) ? ai.messages : [];
            if (legacyMessages.length > currentMessages.length) {
                session.messages = legacyMessages.filter(m => !m.loading);
            }
            session.draftPlan = ai.draftPlan || null;
            session.feasibilityReport = ai.feasibilityReport || null;
            session.updatedAt = new Date().toISOString();
            updateAiSessionTitle(session);
        }

        function commitAiPlanToCurrentSession(draftPlan, feasibilityReport) {
            ensureAiAssistant();
            const ai = activityData.aiAssistant;
            const session = getCurrentAiSession();
            ai.draftPlan = draftPlan || ai.draftPlan || null;
            ai.feasibilityReport = feasibilityReport || ai.feasibilityReport || null;
            if (session) {
                session.draftPlan = ai.draftPlan;
                session.feasibilityReport = ai.feasibilityReport;
                session.updatedAt = new Date().toISOString();
            }
            syncAiSessionToLegacy();
        }

        function ensureAiPreviewForCurrentSession() {
            ensureAiAssistant();
            const ai = activityData.aiAssistant;
            const session = getCurrentAiSession();
            if (session) {
                ai.draftPlan = ai.draftPlan || session.draftPlan || null;
                ai.feasibilityReport = ai.feasibilityReport || session.feasibilityReport || null;
            }
            const hasUserIdea = getCurrentAiMessages().some(m => m.role === "user");
            if (hasUserIdea && ai.draftPlan && !ai.feasibilityReport) {
                ai.feasibilityReport = buildAiFeasibilityReport(getLastUserIdea());
                if (session) session.feasibilityReport = ai.feasibilityReport;
            }
            if (hasUserIdea && ai.feasibilityReport && !ai.draftPlan) {
                ai.draftPlan = buildAiDraftPlan(getLastUserIdea());
                if (session) session.draftPlan = ai.draftPlan;
            }
        }

        function repairAiAssistantState() {
            const ai = activityData.aiAssistant;
            const session = getCurrentAiSession();
            const messages = session ? getCurrentAiMessages() : (Array.isArray(ai.messages) ? ai.messages : []);
            const now = Date.now();
            let repaired = false;
            const repairedMessages = messages.map(m => {
                if (!m.loading) return m;
                const createdAt = Date.parse(m.createdAt || "");
                const isStale = !ai.activeRequestId || !createdAt || now - createdAt > AI_REQUEST_TIMEOUT_MS;
                if (!isStale) return m;
                repaired = true;
                return {
                    role: "assistant",
                    text: "模型响应时间过长，已自动结束本次等待。请检查 AI 代理状态，或重新发送这条消息。",
                    createdAt: new Date().toISOString()
                };
            });
            if (session) session.messages = repairedMessages;
            ai.messages = repairedMessages;
            const hasLoading = repairedMessages.some(m => m.loading);
            ai.isThinking = !!hasLoading;
            if (!hasLoading) ai.activeRequestId = null;

            const lastUserIndex = repairedMessages.map(m => m.role).lastIndexOf("user");
            const hasAssistantAfterLastUser = lastUserIndex >= 0 && repairedMessages.slice(lastUserIndex + 1).some(m => m.role === "assistant" && !m.loading);
            if (!ai.draftPlan && hasAssistantAfterLastUser) {
                const lastIdea = getLastUserIdea();
                ai.draftPlan = buildAiDraftPlan(lastIdea);
                ai.feasibilityReport = ai.feasibilityReport || buildAiFeasibilityReport(lastIdea);
            }
            return repaired;
        }

        function isAiThinking() {
            ensureAiAssistant();
            return getCurrentAiMessages().some(m => m.loading);
        }

        function isAiRequestActive() {
            ensureAiAssistant();
            return !!activityData.aiAssistant.activeRequestId;
        }

        function getLastUserIdea() {
            const messages = getCurrentAiMessages();
            for (let i = messages.length - 1; i >= 0; i--) {
                if (messages[i].role === "user") return messages[i].text || activityData.aiAssistant.ideaInput || "新活动策划";
            }
            return activityData.aiAssistant.ideaInput || "新活动策划";
        }

        function renderAiAssistant() {
            ensureAiAssistant();
            ensureAiPreviewForCurrentSession();
            const ai = activityData.aiAssistant;
            const floatWrap = document.getElementById("aiFloatWrap");
            const mini = document.getElementById("aiMiniChat");
            const fullscreen = document.getElementById("aiFullscreen");

            floatWrap.style.display = ai.floatVisible ? "flex" : "none";
            mini.classList.toggle("show", !!ai.miniOpen);
            fullscreen.classList.toggle("show", !!ai.fullscreenOpen);

            mini.innerHTML = renderAiMiniChat();
            fullscreen.innerHTML = renderAiFullscreen();
            scrollAiMessages();
        }

        function startAiAssistantHealthCheck() {
            if (aiAssistantHealthCheckId) return;
            aiAssistantHealthCheckId = setInterval(() => {
                if (!activityData.aiAssistant) return;
                const repaired = repairAiAssistantState();
                if (!repaired) return;
                saveActivityData();
                renderAiAssistant();
            }, 5000);
        }

        function bindAiAssistantActions() {
            document.addEventListener("click", event => {
                const actionEl = event.target.closest("[data-ai-action]");
                if (!actionEl) return;
                const action = actionEl.getAttribute("data-ai-action");
                if (action === "new-conversation") {
                    startNewAiConversation(event);
                }
            });
        }

        function renderAiMiniChat() {
            const thinking = isAiThinking();
            const requestActive = isAiRequestActive();
            return `
            <div class="ai-chat-header">
                <div class="ai-chat-title">
                    <strong>AI 策划助手</strong>
                    <span>先完善想法，再采纳到策划案</span>
                </div>
                <div class="ai-chat-actions">
                    ${requestActive ? '<button class="ai-icon-btn" onclick="cancelAiThinking()" title="停止生成">!</button>' : ''}
                    <button class="ai-icon-btn" onclick="openAiFullscreen()" title="进入主界面">□</button>
                    <button class="ai-icon-btn" onclick="closeAiMiniChat()" title="收起">×</button>
                </div>
            </div>
            <div class="ai-messages" id="aiMiniMessages">${renderAiMessages()}</div>
            <div class="ai-chat-input-wrap">
                <div class="ai-input-hint">普通描述会先生成 3 个活动创意方向；需要写入右侧拟策划案时，请明确输入“生成策划案”。</div>
                <div class="ai-chat-input">
                    <textarea class="textarea" id="aiMiniInput" placeholder="例如：想办一场 AI 工具分享会，面向社团新成员..."
                        ${thinking ? 'disabled' : ''}
                        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendAiMessage('mini')}"></textarea>
                    <button class="btn btn-primary" onclick="sendAiMessage('mini')" ${thinking ? 'disabled' : ''}>${thinking ? '生成中...' : '发送'}</button>
                </div>
            </div>`;
        }

        function renderAiFullscreen() {
            const thinking = isAiThinking();
            const requestActive = isAiRequestActive();
            return `
            <div class="ai-full-header">
                <div class="ai-chat-title">
                    <strong>AI 策划助手主界面</strong>
                    <span>对话完善活动想法，参考历史经验，生成可落入 Step 1 的拟策划案</span>
                </div>
                <div class="ai-chat-actions">
                    ${requestActive ? '<button class="btn btn-outline" onclick="cancelAiThinking()">停止生成</button>' : ''}
                    <button class="btn btn-outline" onclick="applyAiDraftToPlan('fillBlank')">填入空白项</button>
                    <button class="btn btn-primary" onclick="applyAiDraftToPlan('overwrite')">采纳到策划案</button>
                    <button class="ai-icon-btn" onclick="closeAiFullscreen()" title="返回流程页">×</button>
                </div>
            </div>
            <div class="ai-full-body">
                <aside class="ai-side">
                    <button class="btn btn-outline" style="width:100%;justify-content:center;margin:10px 0 12px;" data-ai-action="new-conversation" onclick="startNewAiConversation(event)">＋ 开启新对话</button>
                    ${renderAiConversationPanel()}
                </aside>
                <aside class="ai-side">
                    <div class="ai-panel-title">历史活动经验</div>
                    <p class="ai-muted" style="margin-bottom:12px;">勾选需要借鉴的活动。AI 会读取其中的策划案、预算案、现场照片说明、复盘和归档资料。</p>
                    <div class="ai-history-toolbar">
                        <span class="ai-muted">已勾选 ${getSelectedHistoryActivities().length} / ${aiHistoryActivities.length}</span>
                        <button class="ai-text-action" onclick="clearAiHistorySelection()" ${getSelectedHistoryActivities().length ? "" : "disabled"}>全部取消</button>
                    </div>
                    ${aiHistoryActivities.map(h => renderAiHistoryItem(h)).join("")}
                    <div class="section-card" style="padding:14px;margin-top:16px;">
                        <h3>当前阶段</h3>
                        <p class="ai-muted">本阶段暂不生成预算案，只在可行性评估中提示资金压力与后续核算重点。</p>
                    </div>
                </aside>
                <main class="ai-main">
                    <div class="ai-messages" id="aiFullMessages">${renderAiMessages()}</div>
                    <div class="ai-chat-input-wrap">
                        <div class="ai-input-hint">普通描述会先生成 3 个活动创意方向；需要写入右侧拟策划案时，请明确输入“生成策划案”。</div>
                        <div class="ai-chat-input">
                            <textarea class="textarea" id="aiFullInput" placeholder="继续描述你的活动想法、限制条件或想参考的历史经验..."
                                ${thinking ? 'disabled' : ''}
                                onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendAiMessage('full')}"></textarea>
                            <button class="btn btn-primary" onclick="sendAiMessage('full')" ${thinking ? 'disabled' : ''}>${thinking ? '生成中...' : '发送'}</button>
                        </div>
                    </div>
                </main>
                <aside class="ai-plan-preview">
                    ${renderAiGeneratingPanel()}
                    ${renderAiFeasibilityReport()}
                    ${renderAiDraftPreview()}
                </aside>
            </div>`;
        }

        function renderAiHistoryItem(h) {
            const selected = activityData.aiAssistant.selectedHistoryIds.includes(h.id);
            const materials = getHistoryMaterialLabels(h);
            return `
            <div class="ai-history-item ${selected ? 'selected' : ''}">
                <label class="ai-history-check-row">
                    <input type="checkbox" ${selected ? "checked" : ""} onchange="toggleAiHistory('${h.id}')">
                    <span>
                        <strong>${esc(h.title)}</strong>
                        <span>${h.tags.map(t => "#" + esc(t)).join(" ")}<br>${esc(h.summary)}</span>
                        <span class="ai-history-materials">
                            ${materials.map(label => `<span>${esc(label)}</span>`).join("")}
                        </span>
                    </span>
                </label>
            </div>`;
        }

        function getHistoryMaterialLabels(h) {
            const labels = [];
            if (hasHistoryContent(h.plan)) labels.push("策划案");
            if (hasHistoryContent(h.budget)) labels.push("预算案");
            if (hasHistoryContent(h.photos)) labels.push("现场照片");
            if (hasHistoryContent(h.reflection)) labels.push("活动复盘");
            if (hasHistoryContent(h.archive)) labels.push("归档资料");
            return labels.length ? labels : ["摘要"];
        }

        function hasHistoryContent(value) {
            if (Array.isArray(value)) return value.length > 0;
            if (value && typeof value === "object") return Object.keys(value).length > 0;
            return String(value || "").trim().length > 0;
        }

        function renderAiConversationRecords() {
            const records = getAiConversationRecords();
            if (!records.length) {
                return `<div class="ai-conversation-empty">还没有可回溯的对话。发送第一个活动想法后，这里会自动生成记录。</div>`;
            }
            return records.map(record => `
                <div class="ai-conversation-item" onclick="restoreAiConversation('${record.sessionId}')">
                    <button class="ai-conversation-delete" title="删除这条对话" onclick="deleteAiConversation(event, '${record.sessionId}')">🗑</button>
                    <strong>${esc(record.title)}</strong>
                    <span class="ai-conversation-time">${esc(record.timeText)}</span>
                    <span class="ai-muted">${esc(record.preview)}</span>
                </div>
            `).join("");
        }

        function renderAiConversationPanel() {
            ensureAiAssistant();
            const records = getAiConversationRecords();
            const open = !!activityData.aiAssistant.conversationHistoryOpen;
            return `
                <div class="ai-collapsible-card">
                    <button class="ai-collapsible-header" onclick="toggleAiConversationPanel()">
                        <strong>${open ? "▾" : "▸"} 过往对话记录</strong>
                        <span>${records.length} 条</span>
                    </button>
                    ${open ? `
                        <div class="ai-collapsible-body">
                            <p class="ai-muted" style="margin:10px 0 12px;">点击任意记录，可恢复该想法对应的拟策划案和可行性评估。</p>
                            ${renderAiConversationRecords()}
                        </div>
                    ` : ""}
                </div>`;
        }

        function toggleAiConversationPanel() {
            ensureAiAssistant();
            activityData.aiAssistant.conversationHistoryOpen = !activityData.aiAssistant.conversationHistoryOpen;
            saveActivityData();
            renderAiAssistant();
        }

        function getAiConversationRecords() {
            ensureAiAssistant();
            return (activityData.aiAssistant.sessions || [])
                .filter(session => Array.isArray(session.messages) && session.messages.length)
                .map(session => {
                    const firstUser = session.messages.find(m => m.role === "user");
                    const lastMessage = [...session.messages].reverse().find(m => !m.loading);
                    const lastAssistant = [...session.messages].reverse().find(m => m.role === "assistant" && !m.loading);
                    const inferredTitle = inferAiConversationTitle(session);
                    return {
                        sessionId: session.id,
                        title: firstUser ? inferredTitle : (session.title || "新对话"),
                        sortTime: Date.parse(session.updatedAt || (lastMessage && lastMessage.createdAt) || session.createdAt || "") || 0,
                        timeText: formatAiMessageTime(session.updatedAt || (lastMessage && lastMessage.createdAt) || session.createdAt),
                        preview: lastAssistant ? summarizeText(lastAssistant.text, 52) : "这条对话还没有 AI 回复。"
                    };
                })
                .sort((a, b) => b.sortTime - a.sortTime);
        }

        function restoreAiConversation(sessionId) {
            ensureAiAssistant();
            const ai = activityData.aiAssistant;
            const session = ai.sessions.find(s => s.id === sessionId);
            if (!session) return;
            ai.currentSessionId = session.id;
            syncAiSessionToLegacy();
            const firstUser = getCurrentAiMessages().find(m => m.role === "user");
            ai.ideaInput = firstUser ? firstUser.text : "";
            saveActivityData();
            renderAiAssistant();
            showToast("已恢复这条对话对应的拟策划案。");
        }

        function startNewAiConversation(event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            ensureAiAssistant();
            if (activeAiAbortController) {
                activeAiAbortController.abort();
                activeAiAbortController = null;
            }
            const ai = activityData.aiAssistant;
            ai.activeRequestId = null;
            ai.isThinking = false;
            const existingSessions = Array.isArray(ai.sessions) ? [...ai.sessions] : [];
            const session = createAiSession("新对话");
            ai.sessions = [...existingSessions, session];
            ai.currentSessionId = session.id;
            syncAiSessionToLegacy();
            ai.ideaInput = "";
            saveActivityData();
            renderAiAssistant();
            showToast("已开启新对话，旧对话仍保留在左侧历史记录中。");
        }

        function deleteAiConversation(event, sessionId) {
            if (event) event.stopPropagation();
            ensureAiAssistant();
            const ai = activityData.aiAssistant;
            const index = ai.sessions.findIndex(s => s.id === sessionId);
            if (index < 0) return;
            const ok = window.confirm("确认删除这条历史对话吗？删除后该对话记录将不会再出现在左侧列表。");
            if (!ok) return;
            ai.sessions.splice(index, 1);
            ai.activeRequestId = null;
            ai.isThinking = false;
            if (!ai.sessions.length) {
                const session = createAiSession("新对话");
                ai.sessions.push(session);
                ai.currentSessionId = session.id;
            } else if (ai.currentSessionId === sessionId) {
                ai.currentSessionId = ai.sessions[ai.sessions.length - 1].id;
            }
            syncAiSessionToLegacy();
            saveActivityData();
            renderAiAssistant();
            showToast("已删除这条历史对话。");
        }

        function summarizeText(text, maxLen) {
            const clean = String(text || "").replace(/\s+/g, " ").trim();
            if (!clean) return "未命名想法";
            return clean.length > maxLen ? clean.slice(0, maxLen - 1) + "…" : clean;
        }

        function inferAiConversationTitle(session) {
            const userTexts = (session?.messages || [])
                .filter(m => m.role === "user")
                .map(m => String(m.text || "").trim())
                .filter(Boolean);
            if (!userTexts.length) return "新对话";
            const combined = userTexts.join("；");
            const societyMatch = combined.match(/为([^，。；;]{2,18}?(社|协会|俱乐部|中心|部门|部))/);
            const society = societyMatch ? societyMatch[1] : "";
            const planMatch = combined.match(/(?:策划|设计|举办|组织|开展|办|做)(?:一场|一次|一个)?([^，。；;]{2,24}?(活动|体验|工作坊|分享会|沙龙|比赛|展|摊位|招新|社展))/);
            let activity = planMatch ? planMatch[1] : "";
            if (!activity) {
                const theme = extractThemeFromIdea(combined);
                activity = trimActivitySuffix(theme);
            }
            const intentTags = [];
            if (/招新|百团|社展|摊位/.test(combined)) intentTags.push("招新");
            if (/脑暴|创意|方案|方向/.test(combined)) intentTags.push("脑暴");
            if (/修改|调整|优化|细化|打磨/.test(combined)) intentTags.push("打磨");
            if (/生成|策划案|完整方案/.test(combined)) intentTags.push("策划案");
            const prefix = society ? `${society}` : "社团";
            const core = activity ? `${prefix}${activity}` : summarizeText(combined, 18);
            const suffix = intentTags.length ? `｜${Array.from(new Set(intentTags)).slice(0, 2).join("、")}` : "";
            return summarizeText(`${core}${suffix}`, 28);
        }

        function updateAiSessionTitle(session) {
            if (!session) return;
            const inferred = inferAiConversationTitle(session);
            if (inferred && inferred !== "新对话") session.title = inferred;
        }

        function refreshAiConversationTitles() {
            const ai = activityData.aiAssistant;
            if (!ai || !Array.isArray(ai.sessions)) return;
            ai.sessions.forEach(updateAiSessionTitle);
        }

        function formatAiMessageTime(value) {
            if (!value) return "早前记录";
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return "早前记录";
            return date.toLocaleString("zh-CN", {
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit"
            });
        }

        function renderAiMessages() {
            ensureAiAssistant();
            const messages = getCurrentAiMessages();
            return messages.map((m, index) => {
                return `
                <div class="ai-message ${m.role === 'user' ? 'user' : 'assistant'} ${m.loading ? 'loading' : ''}">
                    ${renderAiMessageContent(m, index)}
                </div>`;
            }).join("");
        }

        function getPreviousUserMessageText(messageIndex) {
            const messages = getCurrentAiMessages();
            for (let i = messageIndex - 1; i >= 0; i--) {
                if (messages[i] && messages[i].role === "user") return messages[i].text || "";
            }
            return "";
        }

        function buildAiAdoptionForMessage(messageText, messageIndex) {
            return {
                type: "discussionAdoption",
                status: "pending",
                userText: getPreviousUserMessageText(messageIndex),
                assistantText: messageText || "",
                createdAt: new Date().toISOString()
            };
        }

        function renderAiAdoptionControls(message, index) {
            if (!message.adoption || message.adoption.type !== "discussionAdoption") return "";
            const status = message.adoption.status || "pending";
            const statusText = {
                accepted: "已加入策划依据，后续生成策划案时会读取这条讨论。",
                rejected: "已忽略，这条讨论不会进入策划案依据。",
                reserved: "已暂存，最终生成策划案前会再次询问是否采用。"
            }[status];
            if (statusText) {
                return `<span class="ai-confirmation-status">${statusText}</span>`;
            }
            return `
                <div class="ai-adoption-prompt">这条回复可以作为后续策划依据，你也可以继续聊，不必每条都选择。</div>
                <div class="ai-adoption-actions">
                    <button class="btn btn-primary btn-sm" onclick="respondAiDiscussionAdoption(${index}, 'accepted')">加入依据</button>
                    <button class="btn btn-outline btn-sm" onclick="useAiMessageForPlan(${index})">用它生成策划案</button>
                    <button class="btn btn-outline btn-sm" onclick="respondAiDiscussionAdoption(${index}, 'reserved')">暂存</button>
                    <button class="btn btn-outline btn-sm" onclick="respondAiDiscussionAdoption(${index}, 'rejected')">忽略</button>
                </div>`;
        }

        function normalizeAiRichText(text) {
            return String(text || "")
                .replace(/\s+(方案[一二三123ABC][：:｜|])/g, "\n\n$1")
                .replace(/\s+(【方案[一二三123ABC][^】]*】)/g, "\n\n$1")
                .replace(/\s+(【(?:打磨方向|可直接写入策划案的内容|下一步建议|还需要确认)[^】]*】)/g, "\n\n$1")
                .replace(/\s+(核心主题|具体玩法|现场产出|适合情况|活动定位|核心玩法|环节升级|可写入内容|风险提醒|还需确认|下一步)[：:]/g, "\n$1：")
                .replace(/\s+([1-9][）.)])/g, "\n$1");
        }

        function renderAiRichLine(line) {
            const clean = String(line || "").trim();
            if (!clean) return "";
            const labelMatch = clean.match(/^([^：:]{2,10})[：:]\s*(.*)$/);
            if (labelMatch && /核心主题|具体玩法|现场产出|适合情况|活动定位|核心玩法|环节升级|可写入内容|风险提醒|还需确认|下一步/.test(labelMatch[1])) {
                return `<div class="ai-rich-row"><strong>${esc(labelMatch[1])}</strong><span>${esc(labelMatch[2])}</span></div>`;
            }
            if (/^[-•]|^[1-9][）.)]/.test(clean)) {
                return `<div class="ai-rich-bullet">${esc(clean.replace(/^[-•]\s*/, ""))}</div>`;
            }
            return `<p class="ai-rich-paragraph">${esc(clean)}</p>`;
        }

        function renderAiRichBlock(block) {
            const lines = String(block || "").split(/\n+/).map(line => line.trim()).filter(Boolean);
            if (!lines.length) return "";
            const first = lines[0];
            const isOption = /^(方案[一二三123ABC][：:｜|]|【方案[一二三123ABC])/.test(first);
            const isPolish = /^【(?:打磨方向|可直接写入策划案的内容|下一步建议|还需要确认)/.test(first);
            if (isOption || isPolish) {
                return `
                    <section class="${isOption ? "ai-option-block" : "ai-polish-block"}">
                        <h4 class="ai-rich-heading">${esc(first.replace(/[【】]/g, ""))}</h4>
                        ${lines.slice(1).map(renderAiRichLine).join("")}
                    </section>`;
            }
            return `<div>${lines.map(renderAiRichLine).join("")}</div>`;
        }

        function renderAiRichText(text) {
            const normalized = normalizeAiRichText(text);
            const blocks = normalized.split(/\n{2,}/).map(block => block.trim()).filter(Boolean);
            if (!blocks.length) return "";
            return `<div class="ai-rich-reply">${blocks.map(renderAiRichBlock).join("")}</div>`;
        }

        function getReservedAiAdoptionItems() {
            return getCurrentAiMessages().map((message, index) => ({ message, index }))
                .filter(({ message }) => {
                    const adoptionReserved = message.adoption && message.adoption.status === "reserved";
                    const editReserved = message.confirmation && message.confirmation.type === "planEdit" && message.confirmation.status === "reserved";
                    return adoptionReserved || editReserved;
                })
                .map(({ message, index }) => {
                    const userText = message.adoption?.userText || message.confirmation?.editText || getPreviousUserMessageText(index);
                    const assistantText = message.adoption?.assistantText || message.text || "";
                    return {
                        index,
                        title: summarizeText(userText || assistantText, 34),
                        detail: summarizeText(assistantText, 96)
                    };
                });
        }

        function renderAiReservedAdoptionReview(message, index) {
            if (message.reservedReview.status !== "pending") {
                return `${esc(message.text)}<span class="ai-confirmation-status">保留意见复核已完成。</span>`;
            }
            const items = getReservedAiAdoptionItems();
            if (!items.length) {
                return `${esc(message.text)}<span class="ai-confirmation-status">暂时没有需要复核的保留意见。</span>`;
            }
            return `
                ${esc(message.text)}
                <div class="ai-reserved-review">
                    <div class="ai-reserved-review-title">请选择本次生成策划案要采纳的保留意见</div>
                    ${items.map(item => `
                        <label class="ai-reserved-review-item">
                            <input type="checkbox" class="ai-reserved-adoption-checkbox" data-review-index="${index}" value="${item.index}" checked>
                            <span><strong>${esc(item.title || "保留意见")}</strong>${esc(item.detail || "这条讨论将作为策划案生成依据。")}</span>
                        </label>`).join("")}
                    <div class="ai-confirmation-actions">
                        <button class="btn btn-outline btn-sm" onclick="toggleReservedAdoptionReview(${index}, true)">全选</button>
                        <button class="btn btn-outline btn-sm" onclick="toggleReservedAdoptionReview(${index}, false)">全不选</button>
                        <button class="btn btn-primary btn-sm" onclick="confirmReservedAdoptionReview(${index})">确认并生成</button>
                    </div>
                </div>`;
        }

        function renderAiMessageContent(message, index) {
            if (message.loading) return renderAiThinkingMarkup(message.text);
            const base = message.role === "assistant" ? renderAiRichText(message.text) : esc(message.text);
            if (message.reservedReview && message.reservedReview.type === "reservedAdoptionReview") {
                return renderAiReservedAdoptionReview(message, index);
            }
            if (!message.confirmation || message.confirmation.type !== "planEdit") {
                return `${base}${renderAiAdoptionControls(message, index)}`;
            }
            const status = message.confirmation.status || "pending";
            if (status === "accepted") {
                return `${base}<span class="ai-confirmation-status">已确认执行，正在或已经按这条意见修改策划案。</span>`;
            }
            if (status === "rejected") {
                return `${base}<span class="ai-confirmation-status">已选择否，本条意见不会修改策划案。</span>`;
            }
            if (status === "reserved") {
                return `${base}<span class="ai-confirmation-status">已保留意见，最终生成策划案前会再次询问。</span>`;
            }
            return `
                ${base}
                <div class="ai-confirmation-actions">
                    <button class="btn btn-primary btn-sm" onclick="respondAiPlanEditConfirmation(${index}, 'accepted')">是</button>
                    <button class="btn btn-outline btn-sm" onclick="respondAiPlanEditConfirmation(${index}, 'rejected')">否</button>
                    <button class="btn btn-outline btn-sm" onclick="respondAiPlanEditConfirmation(${index}, 'reserved')">保留意见</button>
                </div>`;
        }

        function renderAiThinkingMarkup(text) {
            return `
                <span class="ai-thinking-icon"></span>
                <span class="ai-thinking-text">
                    ${esc(text || "DeepSeek 正在思考并生成拟策划案")}
                    <span class="ai-thinking-dots"><span></span><span></span><span></span></span>
                </span>`;
        }

        function renderAiGeneratingPanel() {
            if (!isAiThinking()) return "";
            return `
            <div class="ai-generating-panel">
                <span class="ai-thinking-icon"></span>
                <span>DeepSeek 正在生成可行性评估和拟策划案。完成后会自动刷新这里的预览。</span>
            </div>`;
        }

        function renderAiFeasibilityReport() {
            ensureAiPreviewForCurrentSession();
            const session = getCurrentAiSession();
            const report = activityData.aiAssistant.feasibilityReport || (session && session.feasibilityReport);
            if (!report) {
                return `
                <div class="ai-panel-title">可行性评估</div>
                <p class="ai-muted" style="margin-bottom:18px;">发送活动想法后，这里会显示评分、关键风险和落地建议。</p>`;
            }
            return `
            <div class="ai-panel-title">可行性评估</div>
            ${report.activityProfile ? `
            <div class="ai-preview-section">
                <h4>AI 活动画像</h4>
                <p>${renderActivityProfileText(report.activityProfile)}</p>
            </div>` : ""}
            <div class="ai-report-grid">
                <div class="ai-report-card"><strong>${report.score}</strong><span class="ai-muted">综合评分</span></div>
                <div class="ai-report-card"><strong>${report.level}</strong><span class="ai-muted">落地难度</span></div>
            </div>
            ${report.conclusion ? `
            <div class="ai-preview-section">
                <h4>结论</h4>
                <p>${esc(report.conclusion)}</p>
            </div>` : ""}
            ${Array.isArray(report.criteria) ? `
            <div class="ai-preview-section">
                <h4>评分依据</h4>
                <p>${report.criteria.map(c => `· ${c.name}：${c.score}/${c.max || 20} - ${c.reason}`).join("\n")}</p>
            </div>` : ""}
            ${Array.isArray(report.triggeredRules) && report.triggeredRules.length ? `
            <div class="ai-preview-section">
                <h4>命中的逻辑规则</h4>
                <p>${report.triggeredRules.map(r => `· [${r.severity || "medium"}] ${r.rule}：${r.reason}`).join("\n")}</p>
            </div>` : ""}
            <div class="ai-preview-section">
                <h4>主要风险</h4>
                <p>${report.risks.map(r => "· " + r).join("\n")}</p>
            </div>
            <div class="ai-preview-section">
                <h4>建议补充</h4>
                <p>${report.suggestions.map(s => "· " + s).join("\n")}</p>
            </div>`;
        }

        function renderActivityProfileText(profile) {
            if (!profile || typeof profile !== "object") return "";
            const labels = {
                domain: "活动领域",
                activityType: "活动类型",
                time: "举办时间",
                scale: "规模",
                audience: "参与对象",
                location: "地点",
                substances: "涉及物质/要素",
                intensity: "强度",
                goals: "目标",
                goal: "目标",
                riskFactors: "风险因子"
            };
            return Object.entries(profile)
                .map(([key, value]) => {
                    const label = labels[key] || key;
                    const text = Array.isArray(value) ? value.join("、") : typeof value === "object" ? JSON.stringify(value) : value;
                    return `· ${label}：${text}`;
                })
                .join("\n");
        }

        function renderAiDraftPreview() {
            ensureAiPreviewForCurrentSession();
            const session = getCurrentAiSession();
            const draft = activityData.aiAssistant.draftPlan || (session && session.draftPlan);
            if (!draft) {
                return `
                <div class="ai-panel-title" style="margin-top:18px;">拟策划案预览</div>
                <p class="ai-muted">这里不会因普通聊天自动填写。AI 会先在对话框里给出 3 个活动创意方向，等你明确输入“生成策划案”后，才会把已采纳的讨论整理成拟策划案。</p>
                <div class="ai-generation-guide">
                    <strong>使用方式</strong><br>
                    1. 先输入活动想法，例如“想办一次动漫社配音体验”。<br>
                    2. AI 会先给出 3 个可选活动方向，你可选择“是 / 否 / 保留意见”。<br>
                    3. 确定方向后，输入“生成策划案”，右侧才会生成正式预览。
                </div>`;
            }
            return `
            <div class="ai-panel-title" style="margin-top:18px;">拟策划案预览</div>
            ${[
                ["活动主题", draft.theme],
                ["活动目标", draft.objective],
                ["服务对象", draft.targetAudience],
                ["活动目的/意义", draft.purpose],
                ["活动内容与流程", draft.contentFlow],
                ["活动需求", draft.requirements],
                ["执行计划与分工", draft.execution],
                ["风险预案", draft.riskPlan]
            ].map(([title, body]) => `
                <div class="ai-preview-section">
                    <h4>${title}</h4>
                    <p>${esc(body)}</p>
                </div>

            ensureAiAssistant();
            activityData.aiAssistant.floatVisible = true;
            activityData.aiAssistant.miniOpen = true;
            renderAiAssistant();
        }

        function closeAiMiniChat() {
            activityData.aiAssistant.miniOpen = false;
            renderAiAssistant();
        }

            activityData.aiAssistant.floatVisible = false;
            activityData.aiAssistant.miniOpen = false;
            renderAiAssistant();
            showToast("AI 策划助手浮标已关闭，本次刷新前不再显示。");
        }
